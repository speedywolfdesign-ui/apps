<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f5c2e" />
<meta name="description" content="BTC 41 Days Transformation Tracker - record daily habits, activity, recipes, fuel program and progress photos." />
<title>BTC Transformation Tracker</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BTC Tracker" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="brand-logo" />
      <div class="brand-text">
        <strong>BTC Tracker</strong>
        <span id="brandSub">41 Days Transformation</span>
      </div>
    </div>
    <button class="who" id="whoChip" type="button" title="Switch participant">
      <span class="who-avatar" id="whoAvatar">?</span>
      <span class="who-name" id="whoName">—</span>
    </button>
  </div>
</header>

<main id="view" class="view"><!-- rendered by app.js --></main>

<!-- ============ Bottom navigation ============ -->
<nav class="tabbar" id="tabbar">
  <button type="button" class="tab" data-tab="home" data-go="home"><span class="ic">🏠</span>Home</button>
  <button type="button" class="tab" data-tab="weekly" data-go="weekly"><span class="ic">📊</span>Weekly</button>
  <button type="button" class="tab tab-add" id="tabAdd" title="Add / edit today's record"><span class="ic">＋</span><span class="sr">Today</span></button>
  <button type="button" class="tab" data-tab="export" data-go="export"><span class="ic">⤓</span>Export</button>
  <button type="button" class="tab" data-tab="more" id="tabMore"><span class="ic">☰</span>More</button>
</nav>

<!-- ============ "More" bottom sheet ============ -->
<div class="sheet-wrap" id="moreSheet" hidden>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h3 class="sheet-title">More</h3>
    <button type="button" data-go="participants">👥 <span>Participants</span><small>Add, switch or remove people</small></button>
    <button type="button" data-go="profile">👤 <span>Profile &amp; goal</span><small>Name, club, coach, start date</small></button>
    <button type="button" data-go="weekly">📊 <span>Weekly &amp; final results</span><small>Week 1–6 and day 41</small></button>
    <button type="button" data-go="backup">💾 <span>Backup &amp; restore</span><small>Save or reload all data</small></button>
    <button type="button" id="menuInstall" hidden>⬇️ <span>Install app</span><small>Add to your home screen</small></button>
    <button type="button" class="sheet-close" data-close-sheet>Close</button>
  </div>
</div>

<!-- ============ Camera modal ============ -->
<div class="modal" id="cameraModal" hidden>
  <div class="modal-card camera-card">
    <div class="modal-head">
      <h3 id="cameraTitle">Take Photo</h3>
      <button class="icon-btn" type="button" data-close-camera>✕</button>
    </div>
    <div class="camera-stage">
      <video id="camVideo" playsinline autoplay muted></video>
      <div class="pose-guide" id="poseGuide"></div>
    </div>
    <p class="camera-hint" id="camHint">Stand 2–3 m away, full body inside the frame.</p>
    <div class="modal-foot camera-foot">
      <button class="btn btn-ghost" type="button" id="camSwitch">🔄 Flip</button>
      <button class="btn btn-primary btn-shutter" type="button" id="camShoot">Capture</button>
      <button class="btn btn-ghost" type="button" data-close-camera>Cancel</button>
    </div>
  </div>
</div>

<!-- ============ Photo viewer ============ -->
<div class="modal" id="photoModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="photoTitle">Photo</h3>
      <button class="icon-btn" type="button" data-close-photo>✕</button>
    </div>
    <div class="photo-stage"><img id="photoBig" alt="Progress photo" /></div>
    <div class="modal-foot">
      <button class="btn btn-danger" type="button" id="photoDelete">Delete photo</button>
      <button class="btn btn-ghost" type="button" data-close-photo>Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/db.js"></script>
<script src="js/photos.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
