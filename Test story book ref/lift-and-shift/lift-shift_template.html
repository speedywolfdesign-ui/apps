    // Keep: makes a nav link that points at THIS page inert (prevents a file:// self-prefetch error).
    // This page lives in a sub-folder; rebase the shared nav's root-relative links to "../".
    (function rebaseNav(){
      var links = document.querySelectorAll('a[href]');
      Array.prototype.forEach.call(links, function(a){
        var h = a.getAttribute('href');
        if (!h || h.charAt(0)==='#' || h.charAt(0)==='/' || h.indexOf('..')===0 || /^[a-z]+:/i.test(h)) return;
        a.setAttribute('href', '../' + h);
      });
    })();

    (function neutralizeSelfLinks(){
      var here = location.href.split('#')[0];
      Array.prototype.forEach.call(document.querySelectorAll('a[href]'), function(a){
        if (a.href.split('#')[0] === here){ a.removeAttribute('href'); a.style.cursor = 'default'; }
      });
    })();
  </script>
