   weight 600 (not extrabold), no bottom border, 16px gap below */
.section-header{ border-bottom:none; padding-bottom:16px; margin-bottom:0; }
.section-title{ font-weight:600; font-size:var(--font-size-2xl); }

/* ─────────────────────────────────────────────────────────────
   1. LEGACY RIBBON  (optional — icon-over-label command groups)
   ───────────────────────────────────────────────────────────── */
.ls-ribbon{
  display:flex; align-items:stretch; gap:0;
  padding:6px 8px 0;
  background:var(--surface-50,#fafafa);
  border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5);
  overflow-x:auto;
  scrollbar-width:thin;
}
.ls-ribbon-group{ display:flex; flex-direction:column; align-items:center; padding:0 6px 2px; min-width:0; }
.ls-ribbon-row{ display:flex; align-items:flex-start; gap:2px; flex:1; }
.ls-ribbon-caption{ margin-top:2px; padding-top:3px; width:100%; text-align:center; font-size:10.5px; color:var(--surface-600,#616161); border-top:var(--border-1,1px) solid var(--surface-200,#e5e5e5); }
.ls-ribbon-sep{ width:1px; align-self:stretch; background:var(--surface-200,#e5e5e5); margin:2px 4px; }
.ls-rbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; min-width:52px; max-width:76px; padding:5px 6px 4px; border:1px solid transparent; border-radius:var(--radius-sm,4px); background:none; cursor:pointer; font-family:inherit; color:var(--surface-800,#3d3d3d); text-align:center; transition:background .12s, border-color .12s; }
.ls-rbtn:hover{ background:var(--blue-50,#eef3fb); border-color:var(--blue-200,#c1d3f1); }
.ls-rbtn .pi{ font-size:20px; color:var(--primary-500,#326fd1); }
.ls-rbtn-label{ font-size:10.5px; line-height:1.15; }
.ls-rbtn-sm{ flex-direction:row; min-width:110px; max-width:none; gap:6px; padding:3px 6px; }
.ls-rbtn-sm .pi{ font-size:14px; }
.ls-rbtn-sm .ls-rbtn-label{ font-size:11px; white-space:nowrap; }
.ls-rbtn-stack{ display:flex; flex-direction:column; gap:1px; }

/* ─────────────────────────────────────────────────────────────
   2. MDI TAB (optional — the "Doc ✕" window tab)
   ───────────────────────────────────────────────────────────── */
.ls-mditabs{ display:flex; align-items:center; gap:2px; padding:4px 8px 0; background:var(--surface-50,#fafafa); border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5); }
.ls-mditab{ display:flex; align-items:center; gap:8px; padding:5px 10px; font-size:12px; font-weight:var(--font-weight-semibold,600); color:var(--surface-800,#3d3d3d); background:var(--surface-0,#fff); border:var(--border-1,1px) solid var(--surface-200,#e5e5e5); border-bottom:none; border-radius:5px 5px 0 0; }
.ls-mditab .pi-times{ font-size:11px; color:var(--surface-500,#737373); cursor:pointer; }
.ls-mditab .pi-times:hover{ color:var(--red-600,#c0392b); }
.ls-mditab-icon{ color:var(--primary-500,#326fd1); font-size:12px; }

/* ─────────────────────────────────────────────────────────────
   3. ACTION TOOLBAR — flat, white, compact
   ───────────────────────────────────────────────────────────── */
.ls-screen .toolbar{ padding:6px 12px; gap:2px; flex-wrap:nowrap; }
/* buttons scroll horizontally instead of wrapping/overflowing the card */
.ls-screen .toolbar-start{ gap:1px; flex-wrap:nowrap; align-items:center; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
.ls-screen .toolbar-start::-webkit-scrollbar{ height:0; width:0; display:none; }
.ls-screen .toolbar-end{ flex:0 0 auto; }
.ls-screen .toolbar .btn-secondary{ background:transparent; border-color:transparent; color:var(--surface-700,#4f4f4f); box-shadow:none; font-weight:500; }
.ls-screen .toolbar .btn-secondary:hover{ background:var(--surface-100,#f5f5f5); border-color:transparent; }
.ls-screen .toolbar .btn-group{ border:none; box-shadow:none; }
.ls-screen .toolbar .btn-group .pi{ color:var(--surface-600,#616161); }
.ls-screen .btn-sm{ padding:4px 8px; font-size:12px; }
.ls-screen .btn-icon-only.btn-sm{ width:26px; padding:4px 0; }
.ls-screen .btn .pi{ font-size:12px; }
.ls-screen .btn-icon-left{ margin-right:5px; }
.ls-screen .btn-icon-right{ margin-left:4px; }
.ls-screen .toolbar-search{ height:26px; width:190px; font-size:12px; }
.ls-toolbar-sep{ width:1px; align-self:center; height:18px; background:var(--surface-200,#e5e5e5); margin:0 6px; }
.ls-toolbar-info{ padding:0 7px; font-size:12px; color:var(--surface-700,#4f4f4f); white-space:nowrap; }

/* ─────────────────────────────────────────────────────────────
   4. PANEL HEADERS — subtle uppercase labels + master/detail split
   ───────────────────────────────────────────────────────────── */
.ls-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 14px; background:var(--surface-0,#fff);
  border:none; border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5); border-radius:0;
}
.ls-head .panel-title,
.ls-head .ls-title{ color:var(--surface-500,#737373); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-shadow:none; }
.ls-head .pi{ font-size:12px; color:var(--surface-400,#bdbdbd); cursor:pointer; margin-left:10px; }
.ls-head .pi:hover{ color:var(--primary-500,#326fd1); }

.ls-split{ display:flex; align-items:stretch; gap:12px; padding:0; background:transparent; }
.ls-split > .panel.ls-nav{ flex:0 0 34%; max-width:34%; display:flex; flex-direction:column; }
.ls-split > .panel.ls-data{ flex:1; min-width:0; }
/* multi-column layout helpers (e.g. 3-column report writer: side / main / side) */
.ls-split > .panel.ls-col-side{ flex:0 0 224px; max-width:224px; min-width:0; display:flex; flex-direction:column; }
.ls-split > .panel.ls-col-main{ flex:1; min-width:0; display:flex; flex-direction:column; }

/* stacked master column: two+ navigation cards on the left, sharing the split height */
.ls-split > .ls-navcol{ flex:0 0 30%; max-width:30%; min-width:0; display:flex; flex-direction:column; gap:12px; }
.ls-navcol > .panel{ display:flex; flex-direction:column; flex:1 1 0; min-height:0; }

.ls-nav .table-wrap{ border:none; border-radius:0; flex:1; max-height:460px; overflow:auto; }
.ls-nav table.proj-table{ min-width:0; }
.ls-screen .proj-table{ font-size:12px; border-collapse:collapse; }
/* flat, left-aligned, hairline column headers */
.ls-screen .proj-table th{
  padding:5px 12px; font-size:11px; text-align:left; font-weight:600;
  color:var(--surface-700,#4f4f4f); background:var(--surface-0,#fff);
  border-right:none; border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5);
}
.ls-screen .proj-table td{ padding:5px 12px; border-right:none; border-bottom:var(--border-1,1px) solid var(--surface-100,#f5f5f5); color:var(--surface-800,#3d3d3d); }
.ls-nav .proj-table tbody tr{ cursor:pointer; }
.ls-nav .proj-table tbody tr:hover td{ background:var(--surface-50,#fafafa); }
/* light-blue selection with a blue left accent (via the gutter cell) */
.ls-nav .proj-table tbody tr.is-selected td{ background:var(--blue-50,#eef3fb); color:var(--surface-900,#262626); font-weight:500; }
.ls-screen .proj-table .ls-gutter{ width:3px; min-width:3px; padding:0; text-align:center; background:transparent; border:none; }
.ls-nav .proj-table tbody td.ls-gutter .pi{ display:none; }
.ls-nav .proj-table tbody tr.is-selected td.ls-gutter{ background:var(--primary-500,#326fd1); }

/* ─────────────────────────────────────────────────────────────
   5. DATA FORM (labelled inline fields) — compact
   ───────────────────────────────────────────────────────────── */
.ls-data .panel-content{ padding:12px 16px; background:var(--surface-0,#fff); }
.ls-form{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 22px; }
.ls-frow{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.ls-frow > label{ font-size:12px; font-weight:500; color:var(--surface-600,#616161); white-space:nowrap; }
.ls-frow-fill{ flex-basis:100%; }
.ls-screen .ls-frow .input-text{ padding:3px 9px; font-size:12px; width:230px; }
.ls-screen .ls-frow .input-text.ls-grow{ width:560px; max-width:60vw; }
.ls-screen .ls-frow .input-text.ls-sm{ width:130px; }
.ls-screen .ls-frow .dropdown{ padding:3px 9px; min-width:110px; width:auto; }
.ls-screen .ls-frow .dropdown-value{ font-size:12px; }
.ls-frow .checkbox-wrapper{ gap:6px; }
.ls-screen .ls-frow .checkbox-label{ font-size:12px; color:var(--surface-700,#4f4f4f); }
.ls-frow-inline{ display:flex; align-items:center; gap:8px; }

/* small checkboxes everywhere on the screen */
.ls-screen .checkbox-box{ width:14px; height:14px; }
.ls-screen .checkbox-check-icon{ font-size:9px; }

/* compact inputs & dropdowns across the whole screen */
.ls-screen .input-text{ padding:3px 9px; font-size:12px; }
.ls-screen .dropdown{ padding:3px 9px; }

/* Flat titled section groups (no box, no fill).
   min-width:0 defeats the <fieldset> min-content quirk so it can't
   expand past its parent (lets wide matrices scroll instead). */
.ls-fieldset{ border:none; border-radius:0; background:transparent; padding:0; margin-top:14px; min-width:0; }
.ls-fieldset > legend{ display:block; width:100%; box-sizing:border-box; font-size:12.5px; font-weight:600; color:var(--surface-800,#3d3d3d); padding:0 0 6px; margin-bottom:10px; border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5); }
.ls-fieldset.ls-tint{ background:transparent; border:none; }

/* Numeric matrix (e.g. totals) — light + compact, scrolls horizontally */
.ls-totals-scroll{ overflow-x:auto; max-width:100%; padding-bottom:4px; scrollbar-width:thin; scrollbar-color:var(--surface-300,#d4d4d4) var(--surface-100,#f5f5f5); }
/* always-visible horizontal scrollbar (macOS hides overlay scrollbars) */
.ls-totals-scroll::-webkit-scrollbar{ height:10px; }
.ls-totals-scroll::-webkit-scrollbar-track{ background:var(--surface-100,#f5f5f5); border-radius:6px; }
.ls-totals-scroll::-webkit-scrollbar-thumb{ background:var(--surface-300,#d4d4d4); border-radius:6px; }
.ls-totals-scroll::-webkit-scrollbar-thumb:hover{ background:var(--surface-400,#bdbdbd); }
.ls-totals{ width:max-content; min-width:100%; border-collapse:collapse; font-size:11px; margin-top:2px; }
.ls-totals th{ text-align:center; font-weight:500; color:var(--surface-500,#737373); padding:2px 5px; vertical-align:bottom; line-height:1.2; white-space:nowrap; }
.ls-totals th:first-child{ text-align:left; }
.ls-totals td{ padding:2px 5px; }
.ls-totals td:first-child{ font-weight:500; color:var(--surface-600,#616161); white-space:nowrap; }
.ls-cell{ width:86px; padding:4px 7px; text-align:right; border:var(--border-1,1px) solid var(--surface-200,#e5e5e5); border-radius:4px; background:var(--surface-0,#fff); font-size:11px; font-family:inherit; color:var(--surface-800,#3d3d3d); }
.ls-cell[readonly]{ background:var(--surface-50,#fafafa); color:var(--surface-600,#616161); }

/* Side-by-side fieldset columns */
.ls-cols{ display:flex; gap:30px; flex-wrap:wrap; margin-top:0; align-items:flex-start; }
.ls-cols > .ls-fieldset{ flex:1 1 340px; min-width:320px; }
.ls-col-form{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:center; }
.ls-col-form > label{ font-size:12px; font-weight:500; color:var(--surface-600,#616161); white-space:nowrap; }
.ls-col-form .full{ grid-column:1 / -1; }
.ls-screen .ls-col-form .input-text{ padding:3px 9px; font-size:12px; width:100%; box-sizing:border-box; }
.ls-screen .ls-col-form .dropdown{ padding:3px 9px; width:100%; box-sizing:border-box; }
.ls-screen .ls-col-form .dropdown-value{ font-size:12px; }
.ls-updrow{ display:flex; align-items:center; gap:6px; }
.ls-updrow .input-text{ flex:1; }

/* vertical checkbox / option group */
.ls-checklist{ display:flex; flex-direction:column; gap:9px; }

/* tree / list navigation (Report list, Tables, Report objects) */
.ls-tree{ list-style:none; margin:0; padding:6px 0; font-size:12px; }
.ls-tree li{ padding:4px 12px; cursor:pointer; color:var(--surface-800,#3d3d3d); white-space:nowrap; }
.ls-tree li:hover{ background:var(--surface-50,#fafafa); }
.ls-tree li.is-active{ background:var(--blue-50,#eef3fb); color:var(--primary-700,#1e437d); font-weight:500; box-shadow:inset 3px 0 0 var(--primary-500,#326fd1); }
.ls-tree li .pi{ font-size:10px; color:var(--surface-500,#737373); margin-right:5px; }
.ls-tree .lvl-1{ padding-left:26px; }
.ls-tree .lvl-2{ padding-left:44px; }
.ls-tree .lvl-3{ padding-left:62px; }

/* small checkbox matrix (e.g. No title / Page break / No total columns) */
.ls-matrix{ width:100%; border-collapse:collapse; font-size:11.5px; }
.ls-matrix th{ font-weight:500; color:var(--surface-500,#737373); padding:2px 6px; text-align:center; white-space:nowrap; line-height:1.2; }
.ls-matrix td{ padding:3px 6px; }
.ls-matrix td:first-child{ color:var(--surface-600,#616161); white-space:nowrap; }
.ls-matrix .ls-mx-check{ text-align:center; }
.ls-matrix .checkbox-box{ margin:0 auto; }

/* horizontal labeled fields (sub-label above the control) */
.ls-fieldrow{ display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end; }
.ls-field{ display:flex; flex-direction:column; gap:4px; }
.ls-field > label{ font-size:11.5px; font-weight:500; color:var(--surface-600,#616161); }
.ls-screen .ls-field .dropdown, .ls-screen .ls-field .input-text{ width:120px; box-sizing:border-box; }

/* read-only mode: toggle .is-readonly on .ls-screen to render controls as plain values */
.ls-screen.is-readonly .input-text,
.ls-screen.is-readonly .dropdown{ border-color:transparent; background:transparent; }
.ls-screen.is-readonly .dropdown{ pointer-events:none; }
.ls-screen.is-readonly .dropdown-arrow{ visibility:hidden; }
.ls-screen.is-readonly .checkbox-box{ pointer-events:none; }
.ls-screen.is-readonly .ls-editonly{ display:none; }   /* browse "…" / inline-edit affordances hidden when read-only */

/* ─────────────────────────────────────────────────────────────
   6. BOTTOM DETAIL PANEL + tab strip (tabs act as the header)
   ───────────────────────────────────────────────────────────── */
.ls-bottom{ margin:0; height:220px; display:flex; flex-direction:column; }
.ls-bottom .ls-tabbody{ background:var(--surface-0,#fff); flex:1 1 auto; overflow:auto; }
.ls-tabbody{ padding:10px 16px; font-size:12px; color:var(--surface-700,#4f4f4f); min-height:48px; }
.ls-tabbody .ls-empty{ color:var(--surface-500,#737373); }
/* full-area editable text (e.g. a Detailed Description body) */
.ls-detail-editor{ width:100%; height:100%; box-sizing:border-box; border:none; outline:none; resize:none; background:transparent; font:inherit; font-size:12px; line-height:1.6; color:var(--surface-800,#3d3d3d); }

.ls-tabs-wrap{ display:flex; align-items:stretch; background:var(--surface-0,#fff); border-bottom:var(--border-1,1px) solid var(--surface-200,#e5e5e5); }
.ls-tabs{ display:flex; gap:2px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:none; -ms-overflow-style:none; scroll-behavior:smooth; }
.ls-tabs::-webkit-scrollbar{ display:none; height:0; width:0; }
.ls-tabs-more{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:28px; border:none; background:var(--surface-0,#fff); color:var(--surface-500,#737373); cursor:pointer; font-family:inherit; }
.ls-tabs-more:hover{ background:var(--surface-100,#f5f5f5); color:var(--primary-500,#326fd1); }
.ls-tab{ padding:7px 12px; font-size:12px; white-space:nowrap; border:none; background:none; color:var(--surface-600,#616161); border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; }
.ls-tab:hover{ color:var(--surface-900,#262626); }
/* active bottom tab = underline accent (modern flat) */
.ls-tab.is-active{ color:var(--primary-500,#326fd1); border-bottom-color:var(--primary-500,#326fd1); font-weight:600; }

/* Bottom tab strip may use the design-system Tab Menu (.tab-menu / .tab-menu-item),
   fitted into the strip with hidden scrollbar + optional end arrow (.ls-tabs-more) */
.ls-tabs-wrap .tab-menu{ flex:1; min-width:0; margin:0; background:transparent; border-bottom:none; scrollbar-width:none; -ms-overflow-style:none; scroll-behavior:smooth; }
.ls-tabs-wrap .tab-menu::-webkit-scrollbar{ display:none; height:0; width:0; }
.ls-tabs-wrap .tab-menu-item{ padding:7px 12px; font-size:12px; margin-bottom:0; font-weight:400; }  /* drop the DS -2px + bold so tabs sit flush and un-bold */

/* ─────────────────────────────────────────────────────────────
   LEFT NAV — icon rail + panel (Design C, adapted from navigation.html)
   Replaces the standard left nav on lift & shift pages.
   ───────────────────────────────────────────────────────────── */
.proj-content{ margin-left:344px; }                 /* rail (88) + panel (256) */
.lnavc{ width:344px; flex-direction:row; padding:0; background:#fff; overflow:visible; }
.lnavc-rail{ width:88px; flex-shrink:0; background:var(--surface-50,#fafafa); border-right:1px solid var(--surface-200,#e5e5e5); padding:12px 6px; overflow-y:auto; display:flex; flex-direction:column; gap:0; }
.lnavc-railitem{ display:flex; flex-direction:column; align-items:center; gap:2px; width:100%; padding:7px 4px; border:none; background:transparent; cursor:pointer; border-radius:8px; text-align:center; font-family:'Inter',sans-serif; font-size:10px; font-weight:500; line-height:1.2; color:var(--surface-800,#404040); }
.lnavc-railitem:hover{ background:var(--surface-200,#e5e5e5); }
.lnavc-railicon{ display:flex; align-items:center; justify-content:center; width:46px; height:34px; border-radius:8px; font-size:16px; color:var(--surface-700,#525252); }
.lnavc-raillabel{ max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lnavc-railitem.is-active{ color:var(--primary-500,#326fd1); font-weight:600; }
.lnavc-railitem.is-active .lnavc-railicon{ background:var(--blue-50,#eef3fb); color:var(--primary-500,#326fd1); }
.lnavc-panel{ flex:1; min-width:0; overflow-y:auto; padding:6px 0; background:#fff; }
.lnavc-grouphead{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:10px 20px; border:none; background:transparent; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--surface-900,#262626); text-align:left; }
.lnavc-grouphead:hover{ background:var(--surface-50,#fafafa); }
.lnavc-chev{ font-size:12px; color:var(--surface-500,#737373); transition:transform .2s; flex-shrink:0; }
.lnavc-group.is-open > .lnavc-grouphead .lnavc-chev{ transform:rotate(180deg); }
.lnavc-items{ display:none; margin:0 0 6px 28px; border-left:1px solid var(--surface-200,#e5e5e5); }
.lnavc-group.is-open > .lnavc-items{ display:block; }
.lnavc-link{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 20px; border:none; background:transparent; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; font-weight:400; color:var(--surface-700,#525252); text-align:left; text-decoration:none; }
.lnavc-link:hover{ background:var(--surface-50,#fafafa); color:var(--surface-900,#262626); }
.lnavc-link.is-active{ color:var(--primary-500,#326fd1); font-weight:500; }

/* ── Collapse / expand toggle + collapsed hover-flyout (icon rail + panel, from navigation.html Design C) ── */
.lnavc-collapse{ position:absolute; right:-11px; top:14px; z-index:130; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0; line-height:1; border:1px solid var(--surface-200,#e5e5e5); border-radius:50%; background:var(--surface-0,#fff); box-shadow:none; cursor:pointer; color:var(--surface-500,#737373); font-size:12px; }
.lnavc-collapse:hover{ color:var(--surface-900,#262626); border-color:var(--surface-300,#d4d4d4); }
.lnavc-collapse .pi{ display:block; line-height:1; transition:transform .2s; }
.lnavc-collapse.is-collapsed .pi{ transform:rotate(180deg); }
.lnavc[data-cmode="collapsed"]{ width:88px; }
body[data-lsnav="rail"][data-railcm="collapsed"] .proj-content{ margin-left:88px; }
.lnavc[data-cmode="collapsed"] .lnavc-panel{ position:absolute; left:88px; top:0; bottom:0; width:256px; background:var(--surface-0,#fff); border-right:1px solid var(--surface-200,#e5e5e5); box-shadow:none; z-index:120; overflow-y:auto; transform:translateX(-10px); opacity:0; pointer-events:none; transition:transform .18s ease, opacity .18s ease; }
.lnavc[data-cmode="collapsed"].flyout-open .lnavc-panel{ transform:translateX(0); opacity:1; pointer-events:auto; }

/* ─────────────────────────────────────────────────────────────
   ACTION MENU (dropdown button) + REGISTER grid
   ───────────────────────────────────────────────────────────── */
.ls-menuwrap{ position:relative; display:inline-block; }
.ls-menu{ position:absolute; top:100%; left:0; margin-top:4px; min-width:150px; background:var(--surface-0,#fff); border:1px solid var(--surface-200,#e5e5e5); border-radius:8px; box-shadow:none; padding:4px; z-index:50; display:none; }
.ls-menu.open{ display:block; }
.ls-menu-item{ display:flex; align-items:center; gap:9px; width:100%; padding:7px 10px; border:none; background:none; border-radius:6px; font-family:inherit; font-size:12.5px; color:var(--surface-800,#3d3d3d); text-align:left; cursor:pointer; }
.ls-menu-item:hover{ background:var(--surface-100,#f5f5f5); }
.ls-menu-item .pi{ font-size:12px; color:var(--surface-500,#737373); }
/* register: narrow checkbox column, selected-row tint */
.ls-reg .proj-table th:first-child, .ls-reg .proj-table td:first-child{ width:34px; text-align:center; padding-left:8px; padding-right:8px; }
.ls-reg .proj-table tbody tr:hover td{ background:var(--surface-50,#fafafa); }


/* ===== LAUNCHER CARDS (grid of clickable action cards) ===== */
.ls-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.ls-card{ display:flex; gap:12px; align-items:flex-start; padding:16px; background:var(--surface-0,#fff); border:1px solid var(--surface-200,#e5e5e5); border-radius:10px; text-decoration:none; color:inherit; cursor:pointer; transition:border-color .12s ease, background .12s ease; }
.ls-card:hover{ border-color:var(--primary-400,#5b8def); background:var(--blue-50,#eef3fb); }
.ls-card-icon{ flex:0 0 auto; width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--blue-50,#eef3fb); color:var(--primary-600,#2b5cb0); }
.ls-card-icon .pi{ font-size:18px; }
.ls-card-body{ min-width:0; }
.ls-card-title{ display:block; font-size:13.5px; font-weight:600; color:var(--surface-900,#1f1f1f); margin:0 0 3px; }
.ls-card-desc{ display:block; font-size:12px; color:var(--surface-500,#737373); margin:0; line-height:1.4; }


/* ===== NAV DESIGN SWITCHER (nested / ribbon / rail) ===== */
body[data-lsnav="nested"] .proj-content{ margin-left:var(--lnav-width-open,256px); }
body[data-lsnav="rail"] .proj-content{ margin-left:344px; }
body[data-lsnav="ribbon"] .proj-content{ margin-left:0; margin-top:150px; }
body[data-lsnav="ribbon"] #leftNavC[data-cmode]{ display:none; }
body[data-lsnav="nested"].lnav-collapsed .proj-content{ margin-left:var(--lnav-width-collapsed,56px); }
.lnav-collapse-btn{ position:absolute; right:-11px; top:14px; z-index:130; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0; line-height:1; border:1px solid var(--surface-200,#e5e5e5); border-radius:50%; background:var(--surface-0,#fff); cursor:pointer; color:var(--surface-500,#737373); font-size:12px; }
.lnav-collapse-btn:hover{ color:var(--surface-900,#262626); border-color:var(--surface-300,#d4d4d4); }
.lnav-collapse-btn .pi{ display:block; line-height:1; transition:transform .2s; }
.lnav-collapse-btn.is-collapsed .pi{ transform:rotate(180deg); }
/* Ribbon */
.lsrib{ position:fixed; top:56px; left:0; right:0; z-index:80; background:var(--surface-0,#fff); border-bottom:1px solid var(--surface-200,#e5e5e5); }
.lsrib-tabs{ display:flex; gap:2px; padding:4px 12px 0; overflow-x:auto; border-bottom:1px solid var(--surface-200,#e5e5e5); scrollbar-width:none; }
.lsrib-tabs::-webkit-scrollbar{ height:0; }
.lsrib-tab{ display:flex; align-items:center; gap:7px; padding:8px 14px; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--surface-700,#4f4f4f); white-space:nowrap; }
.lsrib-tab .pi{ font-size:15px; color:var(--primary-600,#2859a7); }
.lsrib-tab:hover{ background:var(--surface-100,#f5f5f5); }
.lsrib-tab.is-active{ border-bottom-color:var(--primary-500,#326fd1); color:var(--primary-700,#1e437d); }
.lsrib-groups{ display:flex; gap:0; padding:8px 12px; overflow-x:auto; align-items:flex-start; }
.lsrib-group{ display:flex; flex-direction:column; padding:0 14px; border-right:1px solid var(--surface-200,#e5e5e5); }
.lsrib-group:last-child{ border-right:none; }
.lsrib-glabel{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--surface-500,#737373); font-weight:700; margin-bottom:5px; white-space:nowrap; }
.lsrib-links{ display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start; gap:2px 20px; max-height:158px; }
.lsrib-link{ font-size:12px; color:var(--surface-700,#525252); text-decoration:none; white-space:nowrap; padding:2px 3px; border-radius:4px; }
.lsrib-link:hover{ background:var(--blue-50,#eef3fb); color:var(--primary-700,#1e437d); }
.lsrib-link.is-active{ color:var(--primary-600,#2859a7); font-weight:600; }
/* Settings gear + modal */
.lsnav-gear{ position:fixed; top:64px; right:18px; z-index:95; width:34px; height:34px; border-radius:50%; border:1px solid var(--surface-200,#e5e5e5); background:var(--surface-0,#fff); color:var(--surface-600,#616161); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.lsnav-gear:hover{ color:var(--primary-600,#2859a7); border-color:var(--surface-300,#d4d4d4); }
.lsnav-gear .pi{ font-size:15px; }
.lsnav-ov{ position:fixed; inset:0; z-index:200; background:rgba(16,24,40,.35); display:flex; align-items:center; justify-content:center; }
.lsnav-modal{ width:420px; max-width:92vw; background:var(--surface-0,#fff); border-radius:14px; padding:18px 20px 20px; }
.lsnav-modal-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.lsnav-modal-h b{ font-size:15px; color:var(--surface-900,#1f1f1f); }
.lsnav-x{ border:none; background:none; font-size:20px; line-height:1; color:var(--surface-500,#737373); cursor:pointer; }
.lsnav-opt{ display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border:1px solid var(--surface-200,#e5e5e5); border-radius:10px; background:var(--surface-0,#fff); cursor:pointer; text-align:left; font-family:'Inter',sans-serif; margin-bottom:10px; }
.lsnav-opt:hover{ border-color:var(--primary-400,#5b8def); }
.lsnav-opt.is-active{ border-color:var(--primary-500,#326fd1); background:var(--blue-50,#eef3fb); }
.lsnav-opt .pi{ font-size:20px; color:var(--primary-600,#2859a7); width:22px; text-align:center; }
.lsnav-opt b{ display:block; font-size:13.5px; color:var(--surface-900,#1f1f1f); }
.lsnav-opt small{ color:var(--surface-500,#737373); font-size:12px; }

  var _logSeq = 0;

  function appendActionLog(intro, steps) {
    var container = document.getElementById('aiMessages');
    if (!container) return null;
    var logId = 'ai-log-' + (++_logSeq);
    var stepsHtml = steps.map(function(s, i) {
      return '<div class="ai-step ai-step-pending" id="' + logId + '-' + i + '">'
        + '<span class="ai-step-ic"><i class="pi pi-clock"></i></span>'
        + '<span class="ai-step-lbl">' + esc(s.label) + '</span>'
        + '</div>';
    }).join('');
    var div = document.createElement('div');
    div.className = 'ai-message ai-message-assistant';
    div.innerHTML = botAvatar()
      + '<div class="ai-message-bubble">' + intro
      + (steps.length ? '<div class="ai-steps">' + stepsHtml + '</div>' : '')
      + '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return logId;
  }

  function setStepState(logId, idx, state) {
    var el = document.getElementById(logId + '-' + idx);
    if (!el) return;
    el.className = 'ai-step ai-step-' + state;
    var ic = el.querySelector('.ai-step-ic');
    if (state === 'running') ic.innerHTML = '<i class="pi pi-spin pi-spinner"></i>';
    else if (state === 'done')  ic.innerHTML = '<i class="pi pi-check-circle"></i>';
    else if (state === 'error') ic.innerHTML = '<i class="pi pi-times-circle"></i>';
    var c = document.getElementById('aiMessages');
    if (c) c.scrollTop = c.scrollHeight;
  }

  function runSteps(logId, steps, idx) {
    idx = idx || 0;
    if (idx >= steps.length) return;
    setStepState(logId, idx, 'running');
    setTimeout(function() {
      var ok = true;
      try { ok = steps[idx].fn() !== false; } catch(e) { ok = false; }
      setStepState(logId, idx, ok === false ? 'error' : 'done');
      runSteps(logId, steps, idx + 1);
    }, steps[idx].delay !== undefined ? steps[idx].delay : 700);
  }

  /* Fill a field and flash it so the user sees the AI working */
  window.aiFillField = function(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'SELECT') {
      for (var i = 0; i < el.options.length; i++) {
        if (el.options[i].value === value || el.options[i].text === value) {
          el.selectedIndex = i; break;
        }
      }
    } else {
      el.value = value;
    }
    el.classList.remove('ai-field-highlight');
    void el.offsetWidth;
    el.classList.add('ai-field-highlight');
    setTimeout(function() { el.classList.remove('ai-field-highlight'); }, 1200);
  };
  var aiFillField = window.aiFillField;

  /* ══════════════════════════════════════════
     ENTITY EXTRACTORS
  ══════════════════════════════════════════ */

  function extractContractType(text) {
    var m = text.match(/\b(NEC4|FIDIC)\b/i);
    return m ? m[1].toUpperCase() : '';
  }

  function extractContractId(text) {
    var m = text.match(/\b([A-Z][A-Z0-9]*-CON-\d+|CON-\d+)\b/i);
    return m ? m[1].toUpperCase() : '';
  }

  function extractDescription(text) {
    var m = text.match(/["']([^"']{4,})["']/);
    if (m) return m[1];
    m = text.match(/(?:for|called|titled|named|description[:\s]+)\s+(.+?)(?:\s*,|\s+and\s|\s+submit|\s+draft|$)/i);
    if (m) return m[1].trim();
    return '';
  }

  function extractFilterQuery(text) {
    if (/\bactive\b/i.test(text))    return 'active';
    if (/\bdraft\b/i.test(text))     return 'draft';
    if (/\bsubmit/i.test(text))      return 'submitted';
    if (/\bnec4\b/i.test(text))      return 'NEC4';
    if (/\bfidic\b/i.test(text))     return 'FIDIC';
    if (/\bg2\b/i.test(text))        return 'G2';
    if (/\bmanual\b/i.test(text))    return 'Manual';
    return '';
  }

  function getContracts() {
    return window.CONTRACTS || [];
  }

  function findContractIdx(id) {
    var list = getContracts();
    var u = id.toUpperCase();
    for (var i = 0; i < list.length; i++) {
      if (list[i].id.toUpperCase() === u) return i;
    }
    return -1;
  }

  function liveContractSummary() {
    var list = getContracts();
    if (!list.length) return 'No contracts found in this project yet.';
    var active = 0, draft = 0, submitted = 0, types = {};
    list.forEach(function(c) {
      if (c.status === 'ACTIVE')     active++;
      if (c.status === 'DRAFT')      draft++;
      if (c.status === 'SUBMITTED')  submitted++;
      types[c.type] = (types[c.type] || 0) + 1;
    });
    var typeStr = Object.keys(types).map(function(t) {
      return '<strong>' + t + '</strong> (' + types[t] + ')';
    }).join(', ');
    var parts = [];
    if (active)    parts.push(active    + ' Active');
    if (submitted) parts.push(submitted + ' Submitted');
    if (draft)     parts.push(draft     + ' Draft');
    return '<strong>' + list.length + ' contract' + (list.length > 1 ? 's' : '') + '</strong> in this project. '
      + 'Type' + (Object.keys(types).length > 1 ? 's' : '') + ': ' + typeStr + '. '
      + 'Status: ' + parts.join(', ') + '.';
  }

  function liveContractList() {
    var list = getContracts();
    if (!list.length) return 'No contracts in this project yet.';
    var rows = list.map(function(c) {
      return '<li><strong>' + c.id + '</strong> — ' + c.type + ' — '
        + c.description + ' <em>(' + c.status + ')</em></li>';
    }).join('');
    return list.length + ' contract' + (list.length > 1 ? 's' : '') + ':'
      + '<ul class="ai-result-list">' + rows + '</ul>';
  }

  function extractMonthIdx(text) {
    var mc = window.MONTH_CALENDAR;
    if (!mc) return -1;
    var m = text.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s*(\d{4})/i);
    if (m) {
      var mo3 = m[1].toLowerCase().substring(0, 3);
      var yr  = m[2];
      for (var i = 0; i < mc.length; i++) {
        if (mc[i].toLowerCase().startsWith(mo3) && mc[i].includes(yr)) return i;
      }
    }
    var n = text.match(/\bmonth\s+(\d+)\b/i);
    if (n) { var idx = parseInt(n[1]) - 1; if (idx >= 0 && idx < mc.length) return idx; }
    var pct = text.match(/\b(\d+)\s*%\s*(?:through|complete|done)/i);
    if (pct) { var p = parseInt(pct[1]); return Math.min(23, Math.round(p / 100 * 23)); }
    return -1;
  }

  function buildScurveWhatIfSPI(spi) {
    var bac  = window.CHART_BAC  || 40;
    var cpi  = parseFloat((document.getElementById('m-cpispi')?.textContent || '0.92 / 0.88').split('/')[0]) || 0.92;
    var eac  = (bac / cpi).toFixed(1);
    var sc   = window.SCHEDULED_END_IDX || 20;
    var mc   = window.MONTH_CALENDAR || [];
    var slip = Math.round(24 * Math.max(-6, (1 / spi) - 1));
    var compIdx = Math.min(23, Math.max(0, sc + slip));
    var compLabel = mc[compIdx] || '—';
    var schedLabel = mc[sc] || '—';
    var slipText = compIdx === sc ? 'On schedule' : (compIdx > sc ? '+' + (compIdx - sc) + ' months late' : Math.abs(compIdx - sc) + ' months early');
    return '<strong>What-if: SPI = ' + spi.toFixed(2) + '</strong>'
      + '<div style="margin-top:8px;font-size:13px;line-height:1.9">'
      + '<div>📅 <strong>Forecast completion:</strong> ' + compLabel + ' <em>(' + slipText + ' vs ' + schedLabel + ' plan)</em></div>'
      + '<div>💰 <strong>EAC (cost unchanged):</strong> $' + eac + 'M</div>'

      + '</div></div>';
  }

  function buildScurveWhatIfCPI(cpi) {

    var sign = varPct >= 0 ? '+' : '';
    return '<strong>What-if: CPI = ' + cpi.toFixed(2) + '</strong>'
      + '<div style="margin-top:8px;font-size:13px;line-height:1.9">'
      + '<div>💰 <strong>Implied EAC:</strong> $' + eac + 'M (' + sign + varPct + '% vs $' + bac.toFixed(1) + 'M budget)</div>'
      + '<div>📈 <strong>Cost efficiency:</strong> $' + (1 / cpi).toFixed(2) + ' spent per $1.00 of earned value</div>'
      + '<div style="margin-top:6px;padding:6px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:12px;color:#1e40af">'
      + '💡 Adjust the SPI/CPI weight in driver settings and run AI forecast to reflect this scenario on the chart.'
      + '</div></div>';
  }

  function buildScurveExplainDrivers() {
    var aw = window.ACTIVE_WEIGHTS || {};
    var total = Object.values(aw).reduce(function(a, b) { return a + b; }, 0) || 1;
    var sorted = Object.entries(aw)
      .filter(function(e) { return e[1] > 0; })
      .sort(function(a, b) { return b[1] - a[1]; })
      .slice(0, 6);
    var rows = sorted.map(function(e) {
      var pct = ((e[1] / total) * 100).toFixed(0);
      var bar = Math.round(e[1] / 5 * 100);
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
        + '<span style="width:140px;font-size:12px;color:#374151">' + e[0].replace(/_/g, ' ') + '</span>'
        + '<div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px"><div style="height:6px;background:#3b82f6;border-radius:3px;width:' + bar + '%"></div></div>'
        + '<span style="width:36px;text-align:right;font-size:12px;color:#6b7280">' + pct + '%</span>'
        + '</div>';
    }).join('');
    return '<strong>Active driver weights</strong>'
      + '<div style="margin-top:10px">' + rows + '</div>'
      + '<div style="margin-top:8px;font-size:12px;color:#6b7280">Open <em>Driver settings</em> to adjust. Run AI forecast to apply.</div>';
  }

  function buildForecastReply(pd) {
    var eacStr  = '$' + pd.eac + 'M';
    var budgStr = '$' + pd.approvedBudget + 'M';
    var overStr = '+$' + pd.costOverrun + 'M (+' + Math.round(pd.costOverrun / pd.approvedBudget * 100) + '%)';
    return '<strong>Forecast analysis — Cisco Systems</strong>'
      + '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px">'
      + '<div>📊 <strong>EAC (Estimate at Completion):</strong> ' + eacStr + '</div>'
      + '<div style="padding-left:20px;color:#64748b">Budget ' + budgStr + ' → Overrun <strong style="color:#e31b0c">' + overStr + '</strong></div>'
      + '<div style="margin-top:2px">📅 <strong>Forecast completion:</strong> ' + pd.forecastCompletion + '</div>'
      + '<div style="padding-left:20px;color:#64748b">Planned ' + pd.plannedCompletion + ' → Variance <strong>' + Math.abs(pd.scheduleVarianceDays) + ' days ' + (pd.scheduleVarianceDays < 0 ? 'late' : 'early') + '</strong></div>'
      + '<div style="margin-top:2px">⚡ <strong>Key drivers:</strong></div>'
      + '<div style="padding-left:20px;color:#64748b">'
      + '• CPI <strong style="color:#e31b0c">' + pd.cpi + '</strong> — spending $' + (1 / pd.cpi).toFixed(2) + ' per $1 budgeted<br>'
      + '• SPI <strong style="color:#16a34a">' + pd.spi + '</strong> — earning value 23% faster than planned<br>'
      + '• Schedule buffer partially offsets cost risk'
      + '</div></div>';
  }

  function resolveIntent(text) {
    var t = text;

    /* ── S-Curve page handlers ── */
    if (isScurvePage()) {

      // Simulate / time travel
      if (/simulat|time.*travel|move.*to|go.*to|advance.*to|jump.*to/i.test(t)) {
        var sIdx = extractMonthIdx(t);
        if (sIdx >= 0) {
          var sMc = window.MONTH_CALENDAR || [];
          return { type: 'multistep', reply: 'Simulating to <strong>' + (sMc[sIdx] || 'Month ' + (sIdx + 1)) + '</strong>.', steps: buildScurveSimulateSteps(sIdx) };
        }
      }

      // Run AI Forecast (but not "compare AI vs human forecast" — that's handled below)
      if (!/\bcompare\b|vs\.?\s*human|human.*forecast|side.?by.?side/i.test(t) &&
          /run.*forecast|run.*ai|run.*analys|apply.*forecast|ai.*forecast|forecast.*now/i.test(t)) {
        return { type: 'multistep', reply: 'Running AI forecast analysis…', steps: buildScurveRunForecastSteps() };
      }

      // Switch control account
      var scaId = extractCAId(t);
      if (scaId && /switch|change|select|go.*to\b/i.test(t)) {
        return { type: 'multistep', reply: 'Switching to <strong>' + (CA_LABELS[scaId] || scaId) + '</strong>.', steps: buildScurveSwitchCASteps(scaId) };
      }

      // What-if SPI
      if (/what.*if|simulate.*spi/i.test(t) && /\bspi\b/i.test(t)) {
        var spiNum = t.match(/\b(0\.\d+|1\.\d+|2\.\d+)\b/);
        if (spiNum) {
          var spiVal = parseFloat(spiNum[1]);
          if (spiVal > 0 && spiVal < 3) return { type: 'simple', reply: buildScurveWhatIfSPI(spiVal) };
        }
      }

      // What-if CPI
      if (/what.*if|simulate.*cpi/i.test(t) && /\bcpi\b/i.test(t)) {
        var cpiNum = t.match(/\b(0\.\d+|1\.\d+|2\.\d+)\b/);
        if (cpiNum) {
          var cpiVal = parseFloat(cpiNum[1]);
          if (cpiVal > 0 && cpiVal < 3) return { type: 'simple', reply: buildScurveWhatIfCPI(cpiVal) };
        }
      }

      // ── AI-centric actions (only where the page supports them) ──
      // Compare AI vs human forecast — toggles the on-page AI compare
      if (typeof window.toggleAiCompare === 'function' && /\bcompare\b|ai.*vs.*human|human.*vs.*ai|side.?by.?side|vs.*human/i.test(t)) {
        var aiP = document.getElementById('aiCurvePanel');
        if (aiP && aiP.style.display !== 'none') {
          return { type: 'multistep', reply: 'Hiding the AI vs human comparison.', steps: [
            { label: 'Closing the AI S-curve', delay: 350, fn: function() { if (typeof window.toggleAiCompare === 'function') window.toggleAiCompare(); } }
          ]};
        }
        return { type: 'multistep', reply: 'Overlaying the <strong>AI-generated</strong> forecast against the <strong>human-entered</strong> one.', steps: buildAiCompareSteps() };
      }
      // Explain the forecast (Forecast explanation / appendix)
      if (typeof window.toggleAcc === 'function' && document.getElementById('acc-appendix') &&
          /explain.*forecast|forecast.*explanation|how.*(forecast|curve|reach)|appendix|basis.*forecast|why.*forecast|matched.*account/i.test(t)) {
        return { type: 'multistep', reply: 'Opening the <strong>Forecast explanation</strong> — matched neighbour accounts, methods and the assumptions behind the curve.', steps: buildAiExplainSteps() };
      }
      // Warnings
      if (typeof window.toggleAcc === 'function' && document.getElementById('acc-warnings') &&
          /\bwarning|exception|flag(ged)?|anomal|data.*quality|issue/i.test(t)) {
        return { type: 'multistep', reply: 'Opening <strong>Warnings</strong> — data-quality issues, anomalies and low-confidence segments flagged for review.', steps: buildAiWarningsSteps() };
      }
      // Open AI forecast settings
      if (typeof window.openSettingsModal === 'function' &&
          /(open|show|adjust|configure|change|edit).*(setting|weight|driver|parameter)|forecast.*setting|ai.*setting/i.test(t)) {
        return { type: 'multistep', reply: 'Opening <strong>AI forecast settings</strong> — tune the driver weights and methods, then re-run.', steps: buildAiOpenSettingsSteps() };
      }
      // Start the guided tour
      if (typeof window.startAiTour === 'function' && /\btour\b|walkthrough|guide me|show me around|how.*use.*page/i.test(t)) {
        return { type: 'multistep', reply: 'Starting the <strong>guided tour</strong>.', steps: buildAiTourSteps() };
      }

      // Status / EAC query
      if (/\beac\b|current.*status|show.*status|forecast.*status|how.*are.*we|what.*is.*the/i.test(t)) {
        return { type: 'simple', reply: scurveLiveStatus() };
      }

      // Driver weights / explain
      if (/driver|weight|factor/i.test(t)) {
        return { type: 'simple', reply: buildScurveExplainDrivers() };
      }

      // Reset settings
      if (/reset.*setting|restore.*default|default.*setting/i.test(t)) {
        return { type: 'multistep', reply: 'Resetting driver settings to defaults.', steps: buildScurveResetSettingsSteps() };
      }

      // Reset to today
      if (/reset|today|back.*today/i.test(t)) {
        return { type: 'multistep', reply: 'Resetting simulate slider to <strong>today</strong>.', steps: buildScurveResetSteps() };
      }

      // S-curve page fallback
      return {
        type: 'simple',
        reply: isAiCentricPage()
          ? 'On this page I can: <strong>run the AI forecast</strong>, <strong>compare AI vs human</strong>, <strong>explain the forecast</strong>, show <strong>warnings</strong>, <strong>open AI settings</strong>, <strong>start the tour</strong>, simulate time ("Simulate to Jan 2026"), switch accounts, or answer what-if questions ("What if SPI is 0.95?"). What would you like to do?'
          : 'On this page I can: <strong>simulate time</strong> ("Simulate to Jan 2026"), <strong>run AI forecast</strong>, <strong>switch accounts</strong> ("Switch to MEP Systems"), answer <strong>what-if questions</strong> ("What if SPI is 0.95?"), or show <strong>driver weights</strong>. What would you like to do?'
      };
    }

    /* ── Project-home: forecast / EAC ── */
    var pd = window.PROJECT_DATA;
    if (pd && /forecast|eac|estimate.*complet|complet.*date|projection/i.test(t)) {
      return {
        type: 'multistep',
        reply: 'Running forecast analysis…',
        steps: [
          { label: 'Reading performance metrics (CPI, SPI)', delay: 500, fn: function() {} },
          { label: 'Computing estimate at completion (EAC)', delay: 700, fn: function() {} },
          { label: 'Evaluating schedule variance', delay: 600, fn: function() {} },
          { label: 'Building forecast summary', delay: 400, fn: function() {
            setTimeout(function() { appendMessage('assistant', buildForecastReply(pd)); }, 350);
          }}
        ]
      };
    }

    /* ── Project-home: cost / CPI ── */
    if (pd && /cpi|cost.*overrun|cost.*perform|over.*budget|explain.*cost/i.test(t)) {
      var spend = (1 / pd.cpi).toFixed(2);
      return {
        type: 'simple',
        reply: '<strong>Cost performance (CPI: <span style="color:#e31b0c">' + pd.cpi + '</span>)</strong>'
          + '<div style="margin-top:8px;font-size:13px;line-height:1.7">'
          + 'A CPI of <strong>' + pd.cpi + '</strong> means the project spends <strong>$' + spend + '</strong> for every $1.00 budgeted.<br><br>'
          + 'This produces an Estimate at Completion of <strong>$' + pd.eac + 'M</strong> — '
          + '<strong style="color:#e31b0c">$' + pd.costOverrun + 'M above</strong> the approved budget of $' + pd.approvedBudget + 'M.<br><br>'
          + '💡 Immediate review of high-spend cost categories is recommended.'
          + '</div>'
      };
    }

    /* ── Project-home: schedule / SPI ── */
    if (pd && /spi|schedule.*perform|s.?curve|on.*track|behind.*schedule/i.test(t)) {
      return {
        type: 'simple',
        reply: '<strong>Schedule performance (SPI: <span style="color:#16a34a">' + pd.spi + '</span>)</strong>'
          + '<div style="margin-top:8px;font-size:13px;line-height:1.7">'
          + 'SPI above 1.0 means the project is <strong>ahead of schedule</strong> — earning value 23% faster than planned.<br><br>'
          + 'Forecast completion: <strong>' + pd.forecastCompletion + '</strong> vs planned <strong>' + pd.plannedCompletion + '</strong>.<br>'
          + 'Variance: <strong>' + Math.abs(pd.scheduleVarianceDays) + ' days ' + (pd.scheduleVarianceDays < 0 ? 'late' : 'early') + '</strong>.<br><br>'
          + 'The schedule buffer partially offsets the cost overrun risk.'
          + '</div>'
      };
    }

    /* ── Project-home: risk ── */
    if (pd && /\brisk|at.risk|what.*wrong|danger|concern/i.test(t)) {
      return {
        type: 'simple',
        reply: '<strong>Risk assessment — Cisco Systems</strong>'
          + '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:13px">'
          + '<div>🔴 <strong>Cost — HIGH RISK</strong><br>'
          + '<span style="color:#64748b;padding-left:20px;display:block">CPI ' + pd.cpi + ' → $' + pd.costOverrun + 'M projected overrun. Immediate action needed.</span></div>'
          + '<div>🟢 <strong>Schedule — LOW RISK</strong><br>'
          + '<span style="color:#64748b;padding-left:20px;display:block">SPI ' + pd.spi + ' → 23% ahead of plan. Forecast ' + pd.forecastCompletion + '.</span></div>'
          + '<div>🟡 <strong>Completion — MINOR RISK</strong><br>'
          + '<span style="color:#64748b;padding-left:20px;display:block">Forecast ' + Math.abs(pd.scheduleVarianceDays) + ' days past planned date.</span></div>'
          + '</div>'
      };
    }

    /* ── Project-home: summarize ── */
    if (pd && /summarize|summary|overview|status|project.*perform/i.test(t)) {
      return {
        type: 'simple',
        reply: '<strong>Project summary — Cisco Systems</strong>'
          + '<div style="margin-top:8px;font-size:13px;line-height:1.8">'
          + 'Budget: <strong>$' + pd.approvedBudget + 'M</strong> approved<br>'
          + 'EAC: <strong>$' + pd.eac + 'M</strong> forecast (+$' + pd.costOverrun + 'M overrun)<br>'
          + 'CPI: <strong style="color:#e31b0c">' + pd.cpi + '</strong> — cost critical<br>'
          + 'SPI: <strong style="color:#16a34a">' + pd.spi + '</strong> — schedule ahead<br>'
          + 'Completion: <strong>' + pd.forecastCompletion + '</strong> (planned ' + pd.plannedCompletion + ')'
          + '</div>'
      };
    }

    /* ── Project-home: navigate to contracts ── */
    if (pd && /\bcontract/i.test(t)) {
      return { type: 'multistep', reply: 'Taking you to <strong>Contracts</strong>.', steps: buildNavigateSteps('contracts.html', 'Contracts') };
    }

    /* ── View/open contract by ID ── */
    if (/\b(view|show|open|display|detail)\b/i.test(t)) {
      var id = extractContractId(t);
      if (id) {
        var idx = findContractIdx(id);
        if (idx >= 0) {
          return { type: 'multistep', reply: 'Opening contract <strong>' + id + '</strong>.', steps: buildViewContractSteps(id, idx) };
        }
        return { type: 'simple', reply: 'Contract <strong>' + id + '</strong> was not found in this project.' };
      }
    }

    /* ── Delete contract by ID ── */
    if (/\b(delete|remove)\b/i.test(t) && /contract/i.test(t)) {
      var id = extractContractId(t);
      if (id) {
        return { type: 'multistep', reply: 'Deleting contract <strong>' + id + '</strong>.', steps: buildDeleteContractSteps(id) };
      }
      return { type: 'simple', reply: 'Please include the contract ID, e.g. <em>"Delete G2-CON-5606"</em>.' };
    }

    /* ── Duplicate contract by ID ── */
    if (/\b(duplicate|copy)\b/i.test(t) && /contract/i.test(t)) {
      var id = extractContractId(t);
      if (id) {
        return { type: 'multistep', reply: 'Duplicating contract <strong>' + id + '</strong>.', steps: buildDuplicateContractSteps(id) };
      }
      return { type: 'simple', reply: 'Please include the contract ID, e.g. <em>"Duplicate G2-CON-5606"</em>.' };
    }

    /* ── Create / new contract ── */
    if (/\bcontract\b/i.test(t) && /create|new|add|make|open/i.test(t)) {
      var type     = extractContractType(t);
      var doSubmit = /\bsubmit\b/i.test(t);
      var doDraft  = /\bdraft\b/i.test(t);
      var reply = 'On it! Creating'
        + (type ? ' a <strong>' + type + '</strong>' : ' a new')
        + ' contract'
        + (doSubmit ? ' and submitting it' : doDraft ? ' and saving as draft' : '')
        + '.';
      return { type: 'multistep', reply: reply, steps: buildCreateContractSteps(t) };
    }

    /* ── Create trend → open contract form ── */
    if (/\btrend\b/i.test(t)) {
      return {
        type: 'multistep',
        reply: 'Opening the <strong>Create contract</strong> form for your new trend.',
        steps: [{ label: 'Opening create contract form', delay: 500, fn: function() {
          if (typeof openCreateContractModal === 'function') openCreateContractModal();
        }}]
      };
    }

    /* ── Clear filter / show all ── */
    if (/clear|reset|show all|all contracts/i.test(t)) {
      return { type: 'multistep', reply: 'Clearing filter and showing all contracts.', steps: buildClearFilterSteps() };
    }

    /* ── Filter / search ── */
    if (/filter|show|find|search|list/i.test(t)) {
      var q = extractFilterQuery(t);
      if (q) {
        return { type: 'multistep', reply: 'Filtering contracts by <strong>"' + q + '"</strong>.', steps: buildFilterSteps(q) };
      }
    }

    /* ── Summarize (live) ── */
    if (/summarize|summary|overview/i.test(t)) {
      return { type: 'simple', reply: liveContractSummary() };
    }

    /* ── List all (live) ── */
    if (/list|show all|all contracts|how many|count|total/i.test(t)) {
      return { type: 'simple', reply: liveContractList() };
    }

    /* ── Navigate ── */
    if (/project home|project overview|go.*home/i.test(t)) {
      return { type: 'multistep', reply: 'Taking you to <strong>Project home</strong>.', steps: buildNavigateSteps('project-home.html', 'Project home') };
    }
    if (/\bprojects\b/i.test(t) && /go|open|navigate|take/i.test(t)) {
      return { type: 'multistep', reply: 'Taking you to <strong>Projects</strong>.', steps: buildNavigateSteps('projects.html', 'Projects') };
    }

    /* ── Fallback ── */
    return { type: 'simple', reply: pickSimpleResponse(t) };
  }

  /* ══════════════════════════════════════════
     SIMPLE FALLBACK RESPONSES

  var SIMPLE = [
    { test: /anomal|risk|flag|issue|problem/i,
      reply: 'No anomalies detected. All contracts are properly classified. Consider adding completion dates and pay items for deeper risk analysis.' },
    { test: /expir|renew|end date|complet/i,
      reply: 'No completion dates are recorded yet. Add them via the <em>Payment work</em> accordion inside each contract\'s detail view.' },
    { test: /nec4|fidic|type/i,
      reply: 'Both existing contracts are <strong>NEC4</strong> type. FIDIC is also available when creating new contracts.' },
    { test: /status|active|submit/i,
      reply: 'Both contracts are <strong>Active</strong>. Manually created contracts can be saved as <em>Draft</em> or <em>Submitted</em>.' },
    { test: /g2|import|procure/i,
      reply: 'The 2 existing contracts were imported from <strong>G2</strong>. You can also import from ProcureWare via <em>Add → Import from ProcureWare</em>.' },
    { test: /pay item|payitem|quantity|price/i,
      reply: 'Pay items are scope line items — description, quantity, hours, unit price, price type, and control account ID. Expand <em>Pay items</em> inside any contract to manage them.' },
    { test: /s.?curve|spend|budget|cost/i,

    { test: /at.risk|behind|overrun|delay/i,

    { test: /dashboard|navigate|what can/i,
      reply: 'I can create, view, delete, or duplicate contracts; filter the table; summarize data; or navigate anywhere in the project. Just tell me what you need.' }

  function pickSimpleResponse(text) {
    for (var i = 0; i < SIMPLE.length; i++) {
      if (SIMPLE[i].test.test(text)) return SIMPLE[i].reply;
    }
    return "I can help with that. Try: <em>\"Create a NEC4 contract\"</em>, <em>\"View G2-CON-5606\"</em>, <em>\"Delete G2-CON-5605\"</em>, <em>\"Filter active\"</em>, or <em>\"Summarize contracts\"</em>.";
  }

     MESSAGE HELPERS

  function botAvatar() {
    return '<div class="ai-message-avatar ai-avatar-bot">'
      + '<svg width="12" height="12" viewBox="0 0 16 16" fill="none">'
      + '<path d="M8 1L9.5 5.5L14 7L9.5 8.5L8 13L6.5 8.5L2 7L6.5 5.5L8 1Z" fill="white"/></svg></div>';
  }

  function appendMessage(role, html) {
    var container = document.getElementById('aiMessages');
    if (!container) return;
    var isUser = role === 'user';
    var div = document.createElement('div');
    div.className = 'ai-message ' + (isUser ? 'ai-message-user' : 'ai-message-assistant');
    var avatar = isUser ? '<div class="ai-message-avatar ai-avatar-user">JP</div>' : botAvatar();
    div.innerHTML = avatar + '<div class="ai-message-bubble">' + (isUser ? esc(html) : html) + '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    var container = document.getElementById('aiMessages');
    if (!container) return;
    var div = document.createElement('div');
    div.className = 'ai-message ai-message-assistant ai-typing';
    div.id = 'aiTypingIndicator';
    div.innerHTML = botAvatar()
      + '<div class="ai-message-bubble"><div class="ai-typing-dots"><span></span><span></span><span></span></div></div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    var el = document.getElementById('aiTypingIndicator');
    if (el) el.remove();
  }

  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ── Shared dispatch ── */
  function dispatch(text) {
    showTyping();
    var intent = resolveIntent(text);
    setTimeout(function() {
      removeTyping();
      if (intent.type === 'multistep') {
        var logId = appendActionLog(intent.reply, intent.steps);
        runSteps(logId, intent.steps, 0);
      } else {
        appendMessage('assistant', intent.reply);
      }
    }, 500 + Math.random() * 300);
  }

  /* ══════════════════════════════════════════
     PUBLIC API
  ══════════════════════════════════════════ */

  window.sendAiMessage = function () {
    var input = document.getElementById('aiInput');
    var text  = (input.value || '').trim();
    if (!text) return;
    appendMessage('user', text);
    input.value = '';
    autoResizeAiInput(input);
    dispatch(text);
  };

  window.sendAiSuggestion = function (btn) {
    var text = btn.textContent.trim();
    appendMessage('user', text);
    dispatch(text);
  };

  window.handleAiKey = function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAiMessage(); }
  };

  window.autoResizeAiInput = function (el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  };

  window.openAiPanel = function () {
    var panel = document.getElementById('aiPanel');
    if (!panel) return;
    panel.classList.add('ai-panel-open');
    document.body.classList.add('ai-panel-open');
    document.querySelectorAll('.tnav-ai-btn').forEach(function(b) { b.classList.add('active'); });
    var input = document.getElementById('aiInput');
    if (input) setTimeout(function() { input.focus(); }, 320);
  };

  window.closeAiPanel = function () {

  <script>/* ===== DIALOG COMPONENT =====
 * openDialog('id')  — shows .dialog-overlay[id="id"]
 * closeDialog('id') — hides it
 *
 * Markup pattern:
 *
 *   <div class="dialog-overlay" id="myDlg" style="display:none">
 *     <div class="dialog-panel [dialog-panel-sm|lg|xl|fullscreen]">
 *       <div class="dialog-header [dialog-header-lg]">
 *         <div class="dialog-header-text">
 *           <div class="dialog-title">Title</div>
 *           <div class="dialog-subtitle">Optional subtitle</div>
 *         </div>
 *         <div class="dialog-header-actions">
 *           <button class="dialog-action-btn dialog-close" onclick="closeDialog('myDlg')">
 *             <i class="pi pi-times"></i>
 *           </button>
 *         </div>
 *       </div>
 *       <div class="dialog-body"><!-- content --></div>
 *       <div class="dialog-footer">
 *         <button class="btn btn-text" onclick="closeDialog('myDlg')">Cancel</button>
 *         <div class="dialog-footer-right">
 *           <button class="btn btn-secondary">Save Draft</button>
 *           <button class="btn btn-primary">Submit</button>
 *         </div>
 *       </div>
 *     </div>
 *   </div>
 */
(function () {
  window.openDialog = function (id) {
    var overlay = document.getElementById(id);
    if (!overlay) return;
    overlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  };

  window.closeDialog = function (id) {
    var overlay = document.getElementById(id);
    if (!overlay) return;
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
  };

  /* Close on backdrop click */
  document.addEventListener('click', function (e) {
    if (e.target.classList.contains('dialog-overlay')) {
      closeDialog(e.target.id);
    }
  });

  /* Close on Escape */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.dialog-overlay.is-open').forEach(function (o) {
      closeDialog(o.id);
    });
  });
})();
</script>

/* ===== LEFT NAV: highlight active section on scroll ===== */
const sections = document.querySelectorAll('.component-section');
const navLinks = document.querySelectorAll('.left-nav-link');

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(l => l.classList.remove('active'));
      const link = document.querySelector(`.left-nav-link[href="#${entry.target.id}"]`);
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });

sections.forEach(s => observer.observe(s));

navLinks.forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    const target = document.querySelector(link.getAttribute('href'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

/* ===== CHECKBOX ===== */
function toggleCheck(box) {
  if (box.classList.contains('disabled')) return;
  if (box.classList.contains('indeterminate')) {
    box.classList.remove('checked', 'indeterminate');
    box.innerHTML = '';
  } else if (box.classList.contains('checked')) {
    box.classList.remove('checked');
    box.innerHTML = '';
  } else {
    box.classList.add('checked');
    box.innerHTML = '<i class="pi pi-check checkbox-check-icon"></i>';

}

function selectRadio(group, id) {

  if (target && !target.classList.contains('disabled')) target.classList.add('selected');

    box.dataset.radioGroup = 'rg1';
  }

/* ===== INPUT NUMBER ===== */
function changeNum(id, delta) {
  const input = document.getElementById(id);
  const current = parseFloat(input.value) || 0;
  const min = parseFloat(input.min);
  const newVal = current + delta;
  if (!isNaN(min) && newVal < min) return;
  input.value = newVal;
}

/* ===== CHIPS ===== */
function addChip(e) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  const input = e.target;
  const val = input.value.trim().replace(/,$/, '');
  if (!val) return;
  const container = document.getElementById('chipsContainer');
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.innerHTML = `${val}<i class="pi pi-times chip-remove" onclick="removeChip(this)"></i>`;
  container.insertBefore(chip, input);
  input.value = '';
}
function removeChip(icon) {
  icon.closest('.chip').remove();
}

/* ===== ACCORDION ===== */
function toggleAccordion(header) {
  const isActive = header.classList.contains('active');
  const tab = header.closest('.accordion-tab');
  const content = tab.querySelector('.accordion-content');

  document.querySelectorAll('.accordion-header.active').forEach(h => {
    h.classList.remove('active');
    h.querySelector('.accordion-icon').className = 'pi pi-chevron-right accordion-icon';
    const c = h.closest('.accordion-tab').querySelector('.accordion-content');
    if (c) c.style.display = 'none';
  });

  if (!isActive) {
    header.classList.add('active');
    header.querySelector('.accordion-icon').className = 'pi pi-chevron-down accordion-icon';
    if (content) content.style.display = 'block';
  }
}

/* ===== TOAST ===== */
const toastIcons = {
  info:    'pi-info-circle',
  success: 'pi-check',
  warn:    'pi-exclamation-triangle',
  error:   'pi-times-circle'
};
/* Contruent DS toast (Storybook: Components/Base/Toast) — severity surface,
   icon + message + divider + close. Title and detail are both optional. */
function showToast(type, title, detail) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.setAttribute('role', 'status');
  toast.innerHTML = `
    <i class="pi ${toastIcons[type]} toast-icon"></i>
    <div class="toast-body">
      ${title ? `<div class="toast-title">${title}</div>` : ''}
      ${detail ? `<div class="toast-detail">${detail}</div>` : ''}
    </div>
  `;
  container.appendChild(toast);
  setTimeout(() => dismissToast(toast), 3000);
}
function dismissToast(toast) {
  if (!toast || !toast.parentNode) return;
  toast.style.animation = 'toast-out 0.25s ease forwards';
  setTimeout(() => toast.remove(), 250);
}

/* ===== PROJECT CONTEXT ===== */
const PROJ_KEY = 'currentProject';

/* Default project shown until the user selects one */
const DEFAULT_PROJECT = { name: 'Cisco Systems', id: '0128-0919-0001', initials: 'CS', color: '#1565c0' };

function selectProject(el) {
  const proj = {
    name:     el.dataset.projName,
    id:       el.dataset.projId,
    initials: el.dataset.projInitials,
    color:    el.dataset.projColor,
  };
  localStorage.setItem(PROJ_KEY, JSON.stringify(proj));
}

function applyProjectContext() {
  let proj;
  try { proj = JSON.parse(localStorage.getItem(PROJ_KEY)); } catch (e) {}
  if (!proj || !proj.name) proj = DEFAULT_PROJECT;

  /* Text nodes */
  document.querySelectorAll('[data-proj="name"]').forEach(el => { el.textContent = proj.name; });
  document.querySelectorAll('[data-proj="id"]').forEach(el => { el.textContent = proj.id; });
  document.querySelectorAll('[data-proj="initials"]').forEach(el => { el.textContent = proj.initials; });

  /* Avatar elements get both initials + background colour */
  document.querySelectorAll('[data-proj="avatar"]').forEach(el => {
    el.textContent = proj.initials;
    el.style.background = proj.color;
  });

  /* Browser tab title: replace the first segment before " —" */
  document.title = document.title.replace(/^[^—]+—\s*/, proj.name + ' — ');
}

            { key:'change', icon:'pi-sync', label:'Change', groups:[
        { label:'Change', items:[
          { label:'Trend', href:'../change-management/lns-change-trends.html' },

    (function(){
      'use strict';
      var host=document.getElementById('left-nav-mount'); if(!host) return;
      var here=location.pathname.split('/').pop();
      function fileOf(h){ return (h||'').split('#')[0].split('?')[0].split('/').pop(); }
      function gd(){ try{ return localStorage.getItem('ls-nav-design')||'rail'; }catch(e){ return 'rail'; } }
      function sd(d){ try{ localStorage.setItem('ls-nav-design',d); }catch(e){} }
      function gcm(){ try{ return localStorage.getItem('ls-nav-cmode')==='collapsed'?'collapsed':'expanded'; }catch(e){ return 'expanded'; } }
      function scm(v){ try{ localStorage.setItem('ls-nav-cmode',v); }catch(e){} }

      function gog(){ try{ return JSON.parse(localStorage.getItem('ls-rail-groups')||'[]'); }catch(e){ return []; } }
      function sog(a){ try{ localStorage.setItem('ls-rail-groups', JSON.stringify(a)); }catch(e){} }
      function activeKey(){ var k=null; LS_SECTIONS.forEach(function(s){(s.groups||[]).forEach(function(g){g.items.forEach(function(it){ if(fileOf(it.href)===here) k=s.key; });});}); if(!k){ var fb=LS_SECTIONS.filter(function(s){return s.groups;})[0]; k=fb?fb.key:(LS_SECTIONS[0]||{}).key; } return k; }
      var railSel=activeKey(), ribSel=activeKey();

      /* ---- RAIL (icon rail + panel) ---- */
      function panelFor(key){ var sec=LS_SECTIONS.filter(function(s){return s.key===key;})[0];
        if(!sec||!sec.groups) return '<div style="padding:14px 20px;font-size:12px;color:var(--surface-500,#737373)">No items in this section.</div>';
        var cur=sec.groups.some(function(g){return g.items.some(function(it){return fileOf(it.href)===here;});});

        return sec.groups.map(function(g,gi){ var gk=key+'::'+g.label; var o=g.items.some(function(it){return fileOf(it.href)===here;})||_og.indexOf(gk)>=0||(!_any&&gi===0);
          var links=g.items.map(function(it){var a=fileOf(it.href)===here; return '<a class="lnavc-link'+(a?' is-active':'')+'" href="'+it.href+'"><span>'+it.label+'</span></a>';}).join('');
          return '<div class="lnavc-group'+(o?' is-open':'')+'" data-gk="'+gk+'"><button class="lnavc-grouphead" data-toggle="1" type="button"><span>'+g.label+'</span><i class="pi pi-angle-down lnavc-chev"></i></button><div class="lnavc-items">'+links+'</div></div>';}).join('');
      }
      function railHTML(){ var cm=gcm();
        var rail=LS_SECTIONS.map(function(s){return '<button class="lnavc-railitem'+(s.key===railSel?' is-active':'')+'" data-rk="'+s.key+'" title="'+s.label+'" type="button"><span class="lnavc-railicon"><i class="pi '+s.icon+'"></i></span><span class="lnavc-raillabel">'+s.label+'</span></button>';}).join('');
        return '<aside class="lnav lnavc" id="leftNavC" data-cmode="'+cm+'"><button class="lnavc-collapse'+(cm==='collapsed'?' is-collapsed':'')+'" data-railcollapse title="Toggle menu" type="button"><i class="pi pi-angle-left"></i></button><div class="lnavc-rail" id="lnavcRail">'+rail+'</div><div class="lnavc-panel" id="lnavcPanel">'+panelFor(railSel)+'</div></aside>';
      }
      /* ---- NESTED (sidebar) ---- */
      function nestedHTML(){
        function sub(items){ return items.map(function(it){ var a=fileOf(it.href)===here; return '<li><a class="lnav-sublink'+(a?' lnav-sublink-active':'')+'" href="'+it.href+'">'+it.label+'</a></li>'; }).join(''); }
        var nc=gnc();
        return '<aside class="lnav" id="leftNav" data-context="project" data-collapsed="'+(nc?'true':'false')+'"><button class="lnav-collapse-btn'+(nc?' is-collapsed':'')+'" data-nestedcollapse title="Toggle menu" type="button"><i class="pi pi-angle-left"></i></button><div class="lnav-scroll"><nav class="lnav-menu">'+LS_SECTIONS.map(function(s){
          if(!s.groups){ return '<div class="lnav-item"><a class="lnav-link" href="#"><i class="pi '+s.icon+' lnav-icon"></i><span class="lnav-label">'+s.label+'</span></a></div>'; }
          var cur=s.groups.some(function(g){return g.items.some(function(it){return fileOf(it.href)===here;});});
          var groups=s.groups.map(function(g){ var go=g.items.some(function(it){return fileOf(it.href)===here;});
            return '<li class="lnav-subgroup'+(go?' lnav-subgroup-open':'')+'"><button class="lnav-sublink lnav-subgroup-btn" onclick="toggleLnavSubGroup(this)" aria-expanded="'+(go?'true':'false')+'"><span class="lnav-sublabel">'+g.label+'</span><i class="pi pi-angle-down lnav-subchevron"></i></button><ul class="lnav-subsub" aria-hidden="'+(go?'false':'true')+'">'+sub(g.items)+'</ul></li>';
          }).join('');
          return '<div class="lnav-item lnav-has-children'+(cur?' lnav-expanded':'')+'"><button class="lnav-link lnav-parent-btn" onclick="toggleLnavGroup(this)" aria-expanded="'+(cur?'true':'false')+'"><i class="pi '+s.icon+' lnav-icon"></i><span class="lnav-label">'+s.label+'</span><i class="pi '+(cur?'pi-angle-up':'pi-angle-down')+' lnav-chevron"></i></button><ul class="lnav-sub'+(cur?' lnav-sub-open':'')+'" aria-hidden="'+(cur?'false':'true')+'">'+groups+'</ul></div>';
        }).join('')+'</nav></div></aside>';
      }
      /* ---- RIBBON (tabs) ---- */
      function ribbonHTML(){
        var tabs=LS_SECTIONS.map(function(s){return '<button class="lsrib-tab'+(s.key===ribSel?' is-active':'')+'" data-rib="'+s.key+'" type="button"><i class="pi '+s.icon+'"></i><span>'+s.label+'</span></button>';}).join('');
        var sec=LS_SECTIONS.filter(function(s){return s.key===ribSel;})[0];
        var groups = (sec&&sec.groups) ? sec.groups.map(function(g){
          var links=g.items.map(function(it){var a=fileOf(it.href)===here; return '<a class="lsrib-link'+(a?' is-active':'')+'" href="'+it.href+'">'+it.label+'</a>';}).join('');
          return '<div class="lsrib-group"><div class="lsrib-glabel">'+g.label+'</div><div class="lsrib-links">'+links+'</div></div>';
        }).join('') : '<div class="lsrib-group"><div class="lsrib-links" style="color:var(--surface-500,#737373);font-size:12px">No items in this section.</div></div>';
        return '<div class="lsrib"><div class="lsrib-tabs">'+tabs+'</div><div class="lsrib-groups">'+groups+'</div></div>';
      }

      function scope(){ var hh=location.href, re=/^(liftandshift-contract-.+\.html|lift-shift_contract\.html|lns-procure-.+\.html|lns-prime-.+\.html|lns-change-.+\.html|lns-invoice-.+\.html|lns-cost-.+\.html)$/;
        Array.prototype.forEach.call(host.querySelectorAll('a[href]'),function(a){ var f=fileOf(a.getAttribute('href')); if(!re.test(f)||a.href===hh){ a.removeAttribute('href'); a.style.cursor='default'; } });
      }
      function apply(d){ document.body.setAttribute('data-lsnav',d); if(d==='rail'){ document.body.setAttribute('data-railcm',gcm()); } else { document.body.removeAttribute('data-railcm'); }
        host.innerHTML = d==='ribbon'?ribbonHTML(): d==='rail'?railHTML(): nestedHTML();
        document.body.classList.toggle('lnav-collapsed', d==='nested' && gnc());
        scope();
        var _pc=document.querySelector('.proj-content'); if(_pc){ if(d==='ribbon'){ var _rb=host.querySelector('.lsrib'); _pc.style.marginTop=(56+(_rb?_rb.offsetHeight:94))+'px'; } else { _pc.style.marginTop=''; } }
        if(d==='nested'){ var asd=host.querySelector('#leftNav'); if(asd){ asd.addEventListener('mouseenter',function(){ if(gnc()) asd.setAttribute('data-collapsed','false'); }); asd.addEventListener('mouseleave',function(){ if(gnc()) asd.setAttribute('data-collapsed','true'); }); } }
        if(d==='rail'){ var _rc=host.querySelector('#leftNavC'); if(_rc){ var _rail=_rc.querySelector('#lnavcRail'), _pnl=_rc.querySelector('#lnavcPanel'), _shown=railSel; _rc.addEventListener('mouseenter',function(){ if(gcm()==='collapsed') _rc.classList.add('flyout-open'); }); if(_rail&&_pnl){ _rail.addEventListener('mouseover',function(e){ var ri=e.target.closest('.lnavc-railitem'); if(!ri||!ri.dataset.rk||ri.dataset.rk===_shown) return; _shown=ri.dataset.rk; _pnl.innerHTML=panelFor(_shown); _rail.querySelectorAll('.lnavc-railitem').forEach(function(x){ x.classList.toggle('is-active', x===ri); }); }); } _rc.addEventListener('mouseleave',function(){ _rc.classList.remove('flyout-open'); if(_shown!==railSel){ _shown=railSel; if(_pnl) _pnl.innerHTML=panelFor(railSel); if(_rail) _rail.querySelectorAll('.lnavc-railitem').forEach(function(x){ x.classList.toggle('is-active', x.dataset.rk===railSel); }); } }); } }
      }

      host.addEventListener('click',function(e){
        var d=gd();
        if(d==='nested' && gnc()){ var lk=e.target.closest('a.lnav-sublink'); var asdc=host.querySelector('#leftNav'); if(lk && asdc) asdc.setAttribute('data-collapsed','true'); }
        var nco=e.target.closest('[data-nestedcollapse]'); if(nco){ snc(!gnc()); apply('nested'); return; }
        var col=e.target.closest('[data-railcollapse]'); if(col){ scm(gcm()==='collapsed'?'expanded':'collapsed'); apply('rail'); return; }
        var ri=e.target.closest('.lnavc-railitem'); if(ri){ railSel=ri.dataset.rk; apply('rail'); return; }
        var tg=e.target.closest('.lnavc-grouphead'); if(tg){ var grp=tg.closest('.lnavc-group'); var _pnl=grp.closest('.lnavc-panel'); if(grp.classList.contains('is-open') && _pnl && _pnl.querySelectorAll('.lnavc-group.is-open').length<=1){ return; } var op=grp.classList.toggle('is-open'); var gk2=grp.getAttribute('data-gk'); if(gk2){ var arr=gog(); var ix=arr.indexOf(gk2); if(op&&ix<0)arr.push(gk2); if(!op&&ix>=0)arr.splice(ix,1); sog(arr); } return; }
        var rb=e.target.closest('.lsrib-tab'); if(rb){ ribSel=rb.dataset.rib; apply('ribbon'); return; }
      });

      /* settings gear + modal */
      var gear=document.createElement('button'); gear.className='lsnav-gear'; gear.type='button'; gear.title='Navigation style'; gear.innerHTML='<i class="pi pi-cog"></i>';
      document.body.appendChild(gear);
      function opt(d,icon,title,desc){ return '<button class="lsnav-opt'+(gd()===d?' is-active':'')+'" data-design="'+d+'" type="button"><i class="pi '+icon+'"></i><span><b>'+title+'</b><small>'+desc+'</small></span></button>'; }
      gear.addEventListener('click',function(){
        var ov=document.createElement('div'); ov.className='lsnav-ov';
        ov.innerHTML='<div class="lsnav-modal"><div class="lsnav-modal-h"><b>Navigation style</b><button class="lsnav-x" type="button">&times;</button></div><div class="lsnav-opts">'
          +opt('nested','pi-list','Nested sidebar','Expandable vertical menu')
          +opt('ribbon','pi-table','Ribbon tabs','Horizontal tabs with grouped commands')
          +opt('rail','pi-th-large','Icon rail + panel','Icon rail with a slide-out panel (default)')
          +'</div></div>';
        document.body.appendChild(ov);
        ov.addEventListener('click',function(ev){ if(ev.target===ov||ev.target.closest('.lsnav-x')){ ov.remove(); return; } var o=ev.target.closest('[data-design]'); if(o){ var d=o.dataset.design; sd(d); railSel=activeKey(); ribSel=activeKey(); apply(d); ov.remove(); } });
      });

      apply(gd());
    })();

  <script>
  (function(){ 'use strict';
    function setCk(b,on){ if(!b)return; b.classList.toggle('checked',on); b.innerHTML=on?'<i class="pi pi-check checkbox-check-icon"></i>':''; }
    window.erSelectAll=function(el){ var on=!el.classList.contains('checked'); setCk(el,on); Array.prototype.forEach.call(document.querySelectorAll('#erBody .checkbox-box'),function(b){ setCk(b,on); }); };
    function count(){ return document.querySelectorAll('#erBody .checkbox-box.checked').length; }
    window.erParams=function(){ if(window.showToast) showToast('info','Parameters','Report parameters would be configured here.'); };
    window.erCreate=function(){ var n=count(); if(window.showToast) showToast(n?'success':'warn','Create workbook', n? n+' report(s) exported to an Excel workbook.' : 'Select one or more reports first.'); };
  })();
  </script>
  <script>
  /* ls-dropdown-escape: keep DS dropdown menus from being clipped by card overflow:hidden */
  (function(){ if(window.__lsDDEsc) return; window.__lsDDEsc=1;
    function place(){ Array.prototype.forEach.call(document.querySelectorAll('.ls-screen .dropdown.open'),function(dd){
      var m=dd.querySelector('.dropdown-menu'); if(!m) return;
      var r=dd.getBoundingClientRect();
      m.style.position='fixed'; m.style.top=(r.bottom+2)+'px'; m.style.left=r.left+'px'; m.style.right='auto'; m.style.minWidth=r.width+'px'; m.style.maxHeight='300px'; m.style.overflowY='auto'; }); }
    document.addEventListener('click', function(){ setTimeout(place,0); }, false);
  })();
  </script>
