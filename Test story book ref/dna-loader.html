\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Access gate — must load first -->
  <script data-inlined-from="components/auth-gate.js">
/* ============================================================
   AUTH GATE — a simple access-password screen shown before any
   page content. Include this as the FIRST script in <head> on
   every page:  <script src="components/auth-gate.js"><\/script>

   NOTE: this is a lightweight client-side gate for demos/previews,
   not real security — the password lives in this file and is
   visible to anyone who views source. Change ACCESS_PASSWORD below.
   Unlock is remembered for the browser session (sessionStorage).
   ============================================================ */
(function () {
  'use strict';

  var ACCESS_PASSWORD = 'contruent';        // ← set the access password here
  var KEY = 'app-access-granted';

  // Log out / re-lock — clears the session unlock and returns to the password screen.
  // Defined before the early-return so it's available even when already authenticated.
  window.appLogout = window.appLock = function () {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  };

  // Sign-in gate disabled — users are let in directly (no password screen).
  return;

  /* eslint-disable no-unreachable */
  try { if (sessionStorage.getItem(KEY) === '1') return; } catch (e) {}

  var ROOT = document.documentElement;

  // Hide page content until unlocked (no flash). The gate lives on <html>,
  // outside <body>, so it stays visible while the body is hidden.
  var hideCss = document.createElement('style');
  hideCss.id = 'appAuthHide';
  hideCss.textContent = [
    'body{visibility:hidden !important}',
    '#appAuthGate{visibility:visible;position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;',
      'background:linear-gradient(135deg,#0f2343 0%,#1e437d 100%);font-family:Inter,system-ui,sans-serif}',
    '#appAuthGate .ag-card{width:360px;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:30px 28px;text-align:center;box-sizing:border-box}',
    '#appAuthGate .ag-logo{width:46px;height:46px;border-radius:12px;background:#eef3fb;color:#326fd1;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}',
    '#appAuthGate h2{margin:0 0 6px;font-size:20px;color:#0f172a;font-weight:700}',
    '#appAuthGate p{margin:0 0 20px;font-size:13.5px;color:#64748b;line-height:1.5}',
    '#appAuthGate input{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #d4d4d4;border-radius:10px;font-size:14px;font-family:inherit;color:#1e293b;outline:none}',
    '#appAuthGate input:focus{border-color:#326fd1;box-shadow:0 0 0 3px #eef3fb}',
    '#appAuthGate .ag-err{color:#dc2626;font-size:12.5px;margin-top:8px;min-height:16px;text-align:left}',
    '#appAuthGate button{width:100%;margin-top:12px;background:#326fd1;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}',
    '#appAuthGate button:hover{background:#2859a7}',
    '#appAuthGate.ag-shake .ag-card{animation:agShake .35s}',
    '@keyframes agShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}'
  ].join('');
  ROOT.appendChild(hideCss);

  function build() {
    if (document.getElementById('appAuthGate')) return;
    var gate = document.createElement('div');
    gate.id = 'appAuthGate';
    gate.innerHTML =
      '<div class="ag-card" role="dialog" aria-modal="true" aria-label="Sign in">' +
        '<div class="ag-logo">&#128274;</div>' +
        '<h2>Sign in</h2>' +
        '<p>Enter the access password to continue.</p>' +
        '<input type="password" id="agPass" placeholder="Password" autocomplete="current-password" aria-label="Access password" />' +
        '<div class="ag-err" id="agErr" role="alert"></div>' +
        '<button type="button" id="agBtn">Unlock</button>' +
      '</div>';
    ROOT.appendChild(gate);

    var input = gate.querySelector('#agPass'),
        btn   = gate.querySelector('#agBtn'),
        err   = gate.querySelector('#agErr');

    function grant() {
      try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
      gate.parentNode && gate.parentNode.removeChild(gate);
      var h = document.getElementById('appAuthHide');
      if (h && h.parentNode) h.parentNode.removeChild(h);
    }

    function reject() {
      err.textContent = 'Incorrect password. Please try again.';
      gate.classList.remove('ag-shake'); void gate.offsetWidth; gate.classList.add('ag-shake');
      input.select();
    }
    // The visible Unlock button always rejects — knowing the password alone isn't enough.
    btn.addEventListener('click', reject);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); reject(); } });

    // Secret unlock: click the top-left 12x12px corner (no element in the DOM) WITH the correct password.
    gate.addEventListener('click', function (e) {
      if (e.clientX <= 12 && e.clientY <= 12) {
        if (input.value === ACCESS_PASSWORD) grant(); else reject();
      }
    });

    setTimeout(function () { input.focus(); }, 50);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();

</script>
  <title>Wave loader — demo</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: 'Inter', system-ui, sans-serif; background: #f5f7fb; color: #1e293b; }
    .demo { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; text-align: center; }
    .demo h1 { margin: 0; font-size: 22px; }
    .demo p { margin: 0; color: #64748b; max-width: 460px; line-height: 1.5; }
    .demo .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .demo button { background: #326fd1; color: #fff; border: none; border-radius: 10px; padding: 11px 18px; font: 600 14px 'Inter', sans-serif; cursor: pointer; }
    .demo button.alt { background: #e2e8f0; color: #334155; }
    .demo button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="demo">
    <h1>Wave loader</h1>
    <p>A compact, character-based animated 3D wave you can drop over any screen while work is in progress.</p>
    <div class="row">
      <button onclick="WaveLoader.show('Running AI forecast')">Show loader</button>
      <button class="alt" onclick="WaveLoader.show('Analyzing'); setTimeout(()=>WaveLoader.hide(), 3000)">Show for 3s</button>
      <button class="alt" onclick="WaveLoader.hide()">Hide</button>
    </div>
  </div>

  <!-- ============================================================
       WAVE LOADER  —  drop-in overlay loader.
       Usage:  WaveLoader.show('Loading')   /   WaveLoader.hide()
       Self-contained: injects its own overlay + styles, animates a
       rippling 3D ASCII wave, and only runs while visible.
       ============================================================ -->
  <script>
  window.WaveLoader = (function () {
    'use strict';

    // Compact character grid
    const W = 50, H = 28, cx = W / 2, cy = H / 2;

    // Flat grid of sample points over [-1,1]² — y is computed per frame as a wave
    const GX = 34, GZ = 28;
    const grid = [];
    for (let i = 0; i < GX; i++) {
      for (let j = 0; j < GZ; j++) {
        grid.push({ gx: (i / (GX - 1)) * 2 - 1, gz: (j / (GZ - 1)) * 2 - 1 });
      }
    }

    // Wave + projection params
    const AMP = 0.5, KX = 2.2, KZ = 1.7;        // amplitude + wave numbers
    const ZSCALE = 1.45;                         // plane depth
    const CAM = 5, SX = 82, SY = 38;             // perspective
    const TILT = 1.02;                           // look across the surface
    const cT = Math.cos(TILT), sT = Math.sin(TILT);
    const MAXA = AMP * 1.55;                      // for height normalization
    const RAMP = '.,-~:=+xX#';                    // trough → crest ('~' reads as wave)

    let overlay, canvas, ctx, label, raf = null, visible = false, phase = 0, tick = 0, baseText = 'Loading';
    let cwpx = 0, chpx = 0, fontPx = 13, dpr = 1;
    const chBuf = new Array(W * H), zBuf = new Float32Array(W * H), lBuf = new Float32Array(W * H), hBuf = new Float32Array(W * H);

    function injectStyles() {
      if (document.getElementById('wave-loader-styles')) return;
      const s = document.createElement('style');
      s.id = 'wave-loader-styles';
      s.textContent =
        '.wave-loader-overlay{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;' +
        'background:rgba(8,16,48,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}' +
        '.wave-loader-overlay canvas{display:block;filter:drop-shadow(0 6px 22px rgba(40,90,200,.45))}' +
        '.wave-loader-label{font:600 14px/1.4 "Courier New",monospace;letter-spacing:.06em;color:#cfe0ff;text-transform:uppercase}';
      document.head.appendChild(s);
    }

    function build() {
      if (overlay) return;
      injectStyles();
      overlay = document.createElement('div');
      overlay.className = 'wave-loader-overlay';
      overlay.setAttribute('role', 'status');
      overlay.setAttribute('aria-live', 'polite');
      canvas = document.createElement('canvas');
      label = document.createElement('div');
      label.className = 'wave-loader-label';
      overlay.appendChild(canvas);
      overlay.appendChild(label);
      document.body.appendChild(overlay);
      ctx = canvas.getContext('2d');
      layout();
      window.addEventListener('resize', layout);
    }

    function layout() {
      if (!ctx) return;
      dpr = window.devicePixelRatio || 1;
      const target = Math.min(window.innerWidth, window.innerHeight) * 0.34;
      fontPx = Math.max(7, Math.min(16, Math.floor(target / H)));
      ctx.font = '700 ' + fontPx + "px 'Courier New', monospace";
      cwpx = ctx.measureText('M').width || fontPx * 0.6;
      chpx = fontPx;
      canvas.style.width = (W * cwpx) + 'px';
      canvas.style.height = (H * chpx) + 'px';
      canvas.width = Math.floor(W * cwpx * dpr);
      canvas.height = Math.floor(H * chpx * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = '700 ' + fontPx + "px 'Courier New', monospace";
      ctx.textBaseline = 'top';
    }

    function render() {
      phase += 0.12;
      chBuf.fill(undefined); zBuf.fill(-1e9);
      let minO = 1e9, maxO = -1e9;

      for (let p = 0; p < grid.length; p++) {
        const g = grid[p];
        const X = g.gx;
        const Zc = g.gz * ZSCALE;
        // travelling wave (sum of two for organic motion)
        const Y = AMP * (Math.sin(KX * Math.PI * g.gx - phase) + 0.55 * Math.sin(KZ * Math.PI * g.gz - phase * 0.8));
        // tilt the plane about the horizontal axis, then project
        const Y2 = Y * cT - Zc * sT;
        const Z2 = Y * sT + Zc * cT;
        const ooz = 1 / (Z2 + CAM);
        const px = (cx + SX * ooz * X) | 0;
        const py = (cy - SY * ooz * Y2) | 0;
        if (px < 0 || px >= W || py < 0 || py >= H) continue;
        const idx = px + py * W;
        if (ooz > zBuf[idx]) {
          zBuf[idx] = ooz;
          lBuf[idx] = ooz;
          hBuf[idx] = Math.max(0, Math.min(1, (Y / MAXA + 1) / 2));   // 0 trough → 1 crest
          chBuf[idx] = RAMP[Math.min(RAMP.length - 1, (hBuf[idx] * (RAMP.length - 1)) | 0)];
          if (ooz < minO) minO = ooz;
          if (ooz > maxO) maxO = ooz;
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const range = (maxO - minO) || 1;
      for (let y = 0; y < H; y++) {
        const yy = y * chpx;
        for (let x = 0; x < W; x++) {
          const idx = x + y * W, c = chBuf[idx];
          if (c === undefined) continue;
          const depth = (lBuf[idx] - minO) / range;        // far 0 → near 1
          const t = 0.45 * depth + 0.55 * hBuf[idx];        // crests + nearness brighten
          const r = Math.round(40 + 160 * t), g = Math.round(120 + 135 * t);
          ctx.fillStyle = 'rgb(' + r + ',' + g + ',255)';
          ctx.fillText(c, x * cwpx, yy);
        }
      }

      if ((tick++ % 18) === 0) {
        const n = Math.floor(tick / 18) % 4;
        label.innerHTML = baseText + '<span style="opacity:.4">' + '.'.repeat(n) +
                          '</span><span style="opacity:0">' + '.'.repeat(3 - n) + '</span>';
      }
    }

    function loop() { if (!visible) { raf = null; return; } render(); raf = requestAnimationFrame(loop); }

    const api = {
      show: function (text) {
        build();
        baseText = text || 'Loading';
        label.textContent = baseText;
        overlay.style.display = 'flex';
        layout();
        if (!visible) { visible = true; if (!raf) raf = requestAnimationFrame(loop); }
      },
      hide: function () {
        visible = false;
        if (overlay) overlay.style.display = 'none';
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      },
      toggle: function (text) { (visible ? this.hide() : this.show(text)); }
    };
    window.DnaLoader = api;   // backwards-compatible alias
    return api;
  })();
  </script>
</body>
</html>
