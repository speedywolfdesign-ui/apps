<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Project Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D chamber. HUD: brand + stats top-left, team filter bottom-left, inspector drawer right, command ring centered over the core. Single deliberate dark look. */
:root{
  --void:#03050a; --glass:rgba(8,16,28,.74); --glass-2:rgba(14,28,46,.86);
  --line:rgba(110,180,255,.2); --line-hi:rgba(140,205,255,.55);
  --fg:#d8e8f6; --muted:#7a90a8; --ice:#5ab8ff; --ice-hi:#a8dcff;
  --ember:#ff5a24; --amber:#ffb057;
  --ok:#47e0a0; --warn:#ffc24a; --crit:#ff4d6a; --plan:#5ab8ff;
  --display:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--fg);font-family:var(--mono);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stage canvas.pointing{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

.hud{position:fixed;z-index:2}
.brand{top:calc(16px + env(safe-area-inset-top,0px));left:16px;display:flex;flex-direction:column;gap:4px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.34em;line-height:1;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--ember)}
.brand .sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.brand .sub b{color:var(--ice);font-weight:500;font-variant-numeric:tabular-nums}

.stats{top:calc(78px + env(safe-area-inset-top,0px));left:16px;width:248px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--glass);padding:10px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.health{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;padding:2px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.s-active{color:var(--ok)}.pill.s-at-risk{color:var(--warn)}.pill.s-blocked{color:var(--crit)}.pill.s-planning{color:var(--plan)}
.legend{grid-column:1/-1;display:grid;gap:6px;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:8px}

.teams{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:min(560px,calc(100vw - 32px))}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);color:var(--fg);font:500 11px var(--mono);letter-spacing:.08em;padding:7px 11px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:hover{border-color:var(--line-hi)}
.chip[aria-pressed="true"]{border-color:var(--ice);background:rgba(90,184,255,.16)}
.chip .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor;background:currentColor}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}

.hint{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.7;pointer-events:none}
.hint b{color:var(--ember);font-weight:500}
body.has-drawer .hint{display:none}

.drawer{top:calc(16px + env(safe-area-inset-top,0px));right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:350px;background:var(--glass-2);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;animation:slide .28s ease-out}
.drawer::before,.drawer::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--ice);pointer-events:none}
.drawer::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.drawer::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.ins-body{overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.ins-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ins-body h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.ins-body h3{margin:0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice);font-weight:500;display:flex;justify-content:space-between}
.bar{height:6px;background:rgba(120,180,255,.14);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:currentColor;box-shadow:0 0 10px currentColor}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
.kv dt{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.list li{background:rgba(6,12,22,.9);padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.link{background:none;border:0;color:var(--fg);font:500 12.5px var(--mono);padding:0;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.link:hover{color:var(--ice-hi);text-decoration:underline;text-underline-offset:3px}
.crew{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:2px 4px 2px 7px;font-size:11px;color:var(--fg);background:rgba(90,184,255,.06)}
.tag .sw{width:6px;height:6px;border-radius:50%}
.tag button{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:0 3px;line-height:1}
.tag button:hover{color:var(--crit)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:12px;padding:10px;border:1px dashed var(--line)}
.inline{display:flex;gap:6px}
.inline select{flex:1;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}

.btn{background:rgba(90,184,255,.08);border:1px solid var(--line);color:var(--fg);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ice);background:rgba(90,184,255,.16)}
.btn.primary{background:rgba(255,90,36,.16);border-color:rgba(255,90,36,.6);color:#ffd9c9}
.btn.primary:hover{background:rgba(255,90,36,.28);border-color:var(--ember)}
.btn.danger{color:#ffb3c0;border-color:rgba(255,77,106,.35);background:rgba(255,77,106,.06)}
.btn.danger[data-armed]{background:rgba(255,77,106,.25);border-color:var(--crit);color:#fff}
.btn.ghost{background:none}
.icon-btn{background:none;border:1px solid var(--line);color:var(--muted);width:30px;height:30px;cursor:pointer;font:16px var(--mono);line-height:1}
.icon-btn:hover{color:var(--fg);border-color:var(--line-hi)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

select,input[type=text],input[type=number],textarea{width:100%;background:rgba(3,8,16,.85);border:1px solid var(--line);color:var(--fg);font:13px var(--mono);padding:9px 10px;border-radius:0}
select:focus,input:focus,textarea:focus{border-color:var(--ice);outline:none;box-shadow:0 0 0 1px var(--ice)}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--ember)}

/* Command ring */
.cmd{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(255,90,36,.12),rgba(3,5,10,.62) 60%);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.cmd-ring{--rad:158px;position:relative;width:calc(var(--rad)*2 + 120px);height:calc(var(--rad)*2 + 120px);animation:ring-in .35s cubic-bezier(.2,.9,.3,1.2)}
.cmd-ring::before,.cmd-ring::after{content:"";position:absolute;inset:60px;border-radius:50%;border:1px solid rgba(255,90,36,.45);pointer-events:none}
.cmd-ring::after{inset:34px;border:1px dashed rgba(90,184,255,.3);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring-in{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.cmd-center{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:1px solid var(--ember);background:radial-gradient(circle,rgba(255,90,36,.4),rgba(40,10,4,.9) 70%);color:#ffe2d6;font-family:var(--display);font-size:18px;letter-spacing:.3em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 40px rgba(255,90,36,.45)}
.cmd-center small{font:10px var(--mono);letter-spacing:.2em;color:#ffb99c;text-transform:uppercase}
.cmd-opt{--a:calc(var(--i) * 72deg - 90deg);position:absolute;left:50%;top:50%;width:118px;margin:-30px 0 0 -59px;height:60px;transform:rotate(var(--a)) translate(var(--rad)) rotate(calc(-1 * var(--a)));background:var(--glass-2);border:1px solid var(--line-hi);color:var(--fg);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cmd-opt b{font-family:var(--display);font-size:15px;color:var(--ice);letter-spacing:.08em}
.cmd-opt:hover{border-color:var(--ember);background:rgba(255,90,36,.18)}
.cmd-opt:hover b{color:var(--amber)}

/* Modal form */
.modal{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(2,4,8,.66);padding:16px}
.form{width:min(440px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--glass-2);border:1px solid var(--line-hi);padding:22px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:ring-in .25s ease-out}
.form h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.checks{max-height:180px;overflow:auto;border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.checks .grp{font-size:10px;letter-spacing:.16em;color:var(--ice);text-transform:uppercase;margin-top:6px}
.checks .grp:first-child{margin-top:0}
.checks label{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.checks input{accent-color:var(--ember)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 10px currentColor;background:currentColor}
.swatches input:checked+span{border-color:#fff}
.swatches input:focus-visible+span{outline:2px solid var(--ice);outline-offset:2px}
.err{color:var(--crit);font-size:12px;min-height:1em}
.form .actions{justify-content:flex-end;margin-top:4px}
.range-row{display:flex;gap:10px;align-items:center}
.range-row output{width:44px;text-align:right;font-variant-numeric:tabular-nums}

#tip{position:fixed;z-index:4;pointer-events:none;background:var(--glass-2);border:1px solid var(--line-hi);padding:7px 10px;font-size:11.5px;max-width:260px;transform:translate(14px,14px);white-space:nowrap}
#tip b{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.04em}
#tip span{color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
#toast{position:fixed;z-index:7;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass-2);border:1px solid var(--ember);color:#ffe0d3;padding:9px 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 24px rgba(255,90,36,.3)}
.reset{background:none;border:0;color:var(--muted);font:10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--fg)}
.reset[data-armed]{color:var(--crit)}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* View switch + breadcrumb */
.views{top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line-hi);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{background:none;border:0;color:var(--muted);font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{color:#fff;background:rgba(90,184,255,.18);box-shadow:inset 0 -2px 0 var(--ice)}
.seg .cmd-btn{color:#ffcdb8}
.seg .cmd-btn:hover{background:rgba(255,90,36,.2);color:#fff}
.crumb{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--glass);border:1px solid var(--line);padding:6px 10px}
.crumb button{background:none;border:0;color:var(--ice);font:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
.crumb button:hover{color:var(--ice-hi);text-decoration:underline;text-underline-offset:3px}
.crumb b{color:var(--fg);font-weight:500}
.perm-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.perm-row select{width:auto;padding:5px 6px;font-size:11.5px}
.perm{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor}
.perm-admin{color:#ffb057}.perm-edit{color:#5ab8ff}.perm-view{color:#8fe3c0}
.perm-key{display:grid;gap:4px;font-size:11px;color:var(--muted)}
.perm-key span{display:flex;gap:8px;align-items:baseline}
.grant{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.grant select{padding:7px 6px;font-size:12px;width:auto;min-width:0}
.grant select:first-child{width:100%}

#vr-ui{position:fixed;inset:0;z-index:8;touch-action:none;cursor:crosshair}
#vr-ui.split::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#000;pointer-events:none}
.vr-gaze{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;pointer-events:none}
.vr-gaze span{flex:1;min-width:0;text-align:center;font:600 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#ffd9c9;text-shadow:0 0 10px #000,0 0 3px #000;padding-inline:12px}
#vr-ui:not(.split) #vr-g2{display:none}
#vr-exit{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(8,16,28,.75)}
.vr-note{position:absolute;left:50%;top:22%;transform:translateX(-50%);max-width:min(420px,calc(100% - 32px));text-align:center;background:var(--glass-2);border:1px solid var(--line-hi);padding:10px 14px;font-size:12px;letter-spacing:.06em;pointer-events:none}
body.vr .hud,body.vr .vignette,body.vr #tip{display:none!important}
.vr-choices{display:grid;gap:8px}
.vr-choices .btn{padding:14px 12px;font-size:12px}

@media (max-width:720px){
  .views{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .seg button{padding:8px 11px;letter-spacing:.1em}
  .brand h1{font-size:18px}
  .stats{width:auto;right:16px;grid-template-columns:repeat(4,minmax(0,1fr));top:calc(64px + env(safe-area-inset-top,0px))}
  .stat{padding:7px 8px}.stat b{font-size:19px}.stat span{font-size:9px;letter-spacing:.1em}
  .legend{display:none}
  .health{gap:4px}
  .teams{flex-wrap:nowrap;overflow-x:auto;right:16px;max-width:none;padding-bottom:2px}
  .chip{flex:0 0 auto}
  .hint{display:none}
  .drawer{top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;max-height:58%}
  @keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .cmd-ring{--rad:118px}
  .cmd-opt{width:100px;margin-left:-50px;height:54px;margin-top:-27px;font-size:10px}
  .cmd-center{width:108px;height:108px;margin:-54px 0 0 -54px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="stage"></div>
<div class="vignette"></div>

<header class="hud brand">
  <h1>PROJECT <em>NEXUS</em></h1>
  <div class="sub"><span>Delivery grid</span><span>Sys <b id="clock">--:--:--</b></span><button class="reset" id="reset" type="button">Reset sample</button></div>
</header>

<section class="hud stats" aria-label="Grid summary">
  <div class="stat"><b id="st-p">0</b><span>Projects</span></div>
  <div class="stat"><b id="st-m">0</b><span>Modules</span></div>
  <div class="stat"><b id="st-u">0</b><span>Crew</span></div>
  <div class="stat"><b id="st-t">0</b><span>Teams</span></div>
  <div class="stat health" id="health"></div>
  <div class="stat legend" id="legend"></div>
</section>

<div class="hud views">
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="chamber" aria-pressed="true">Chamber</button>
    <button type="button" data-view="galaxy" aria-pressed="false">Galaxy</button>
    <button type="button" id="vr-open">VR</button>
    <button type="button" class="cmd-btn" id="cmd-open">Command</button>
  </div>
  <div class="crumb" id="crumb" hidden></div>
</div>

<nav class="hud teams" id="teams" aria-label="Filter by team"></nav>
<div class="hud hint" id="hint"></div>

<aside class="hud drawer" id="inspector" hidden aria-live="polite"><div class="ins-body" id="ins"></div></aside>

<div class="cmd" id="cmd" hidden role="dialog" aria-label="Core commands">
  <div class="cmd-ring">
    <button class="cmd-opt" style="--i:0" data-cmd="project" type="button"><b>P+</b>Add project</button>
    <button class="cmd-opt" style="--i:1" data-cmd="module" type="button"><b>M+</b>Add module</button>
    <button class="cmd-opt" style="--i:2" data-cmd="user" type="button"><b>U+</b>Add crew</button>
    <button class="cmd-opt" style="--i:3" data-cmd="team" type="button"><b>T+</b>Add team</button>
    <button class="cmd-opt" style="--i:4" data-cmd="assign" type="button"><b>⇄</b>Grant access</button>
    <button class="cmd-center" data-cmd="close" type="button">NEXUS<small>Close</small></button>
  </div>
</div>

<div class="modal" id="modal" hidden><form class="form" id="form" novalidate></form></div>
<div id="tip" hidden></div>
<div id="vr-ui" hidden><div class="vr-gaze"><span id="vr-g1"></span><span id="vr-g2"></span></div><div class="vr-note" id="vr-note" hidden></div><button id="vr-exit" class="btn" type="button">Exit VR</button></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  const mods=p.modules.slice(0,MAXR);
  mods.forEach((m,i)=>{
    const c=rm.centers[i],hex=REGION_COLS[i];
    const surf=c.clone().multiplyScalar(PLANET_R*1.003),tip=c.clone().multiplyScalar(PLANET_R*1.5);
    const stem=segs([surf.x,surf.y,surf.z,tip.x,tip.y,tip.z],hex,.75);body.add(stem);
    const beacon=glowSprite(hex,.7,1);beacon.position.copy(surf);body.add(beacon);

    const up=Math.abs(c.y)>.95?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
    const t1=new THREE.Vector3().crossVectors(c,up).normalize(),t2=new THREE.Vector3().crossVectors(c,t1);

      const a=k/nU*TAU,rr2=nU===1?.09:.12+.018*nU;
      const dir=c.clone().add(t1.clone().multiplyScalar(Math.cos(a)*rr2)).add(t2.clone().multiplyScalar(Math.sin(a)*rr2)).normalize();
      const base=dir.clone().multiplyScalar(PLANET_R),pos=dir.clone().multiplyScalar(PLANET_R*1.1);
      const orb=new THREE.Mesh(new THREE.SphereGeometry(.085,14,10),new THREE.MeshBasicMaterial({color:new THREE.Color(teamColor(u)),transparent:true,opacity:1}));
      orb.position.copy(pos);orb.userData={kind:'user',id:uid,mid:m.id};
      const ring=new THREE.Sprite(new THREE.SpriteMaterial({map:RING,color:new THREE.Color(pc),transparent:true,opacity:.95,blending:ADD,depthWrite:false}));ring.scale.set(.36,.36,1);ring.position.copy(pos);
      const st=segs([base.x,base.y,base.z,pos.x,pos.y,pos.z],pc,.6);
      const lab=labelSprite(u.name,PERMS[lv].label,pc);lab.scale.set(2.4,.6,1);lab.position.copy(pos).add(dir.clone().multiplyScalar(.32));lab.visible=false;
      body.add(st,orb,ring,lab);gPickables.push(orb);
      gItems.push({kind:'pin',id:uid,mid:m.id,mats:[[orb.material,1],[ring.material,.95],[st.material,.6],[lab.material,1]],cur:1,target:1,node:orb,ring,label:lab});
    });
  });

}

/* ---------- Selection & highlight ---------- */
let sel=null, hover=null;
function related(s){
  if(!s||s.kind==='core')return null;
  const P=new Set(),M=new Set(),U=new Set();
  if(s.kind==='project'){const p=getProject(s.id);if(!p)return null;P.add(p.id);p.modules.forEach(m=>{M.add(m.id);m.users.forEach(x=>U.add(x));});}
  else if(s.kind==='module'){const f=findModule(s.id);if(!f)return null;P.add(f.p.id);M.add(f.m.id);f.m.users.forEach(x=>U.add(x));}
  else if(s.kind==='user'){U.add(s.id);eachModule((p,m)=>{if(m.users.includes(s.id)){P.add(p.id);M.add(m.id);}});}
  else if(s.kind==='team'){state.users.filter(u=>u.team===s.id).forEach(u=>U.add(u.id));eachModule((p,m)=>{if(m.users.some(x=>U.has(x))){P.add(p.id);M.add(m.id);}});}
  return{P,M,U};
}
function applyHighlight(){
  const r=related(sel);
  items.forEach(it=>{const on=!r||(it.kind==='project'?r.P.has(it.id):it.kind==='module'?r.M.has(it.id):r.U.has(it.id));it.target=on?1:.14;});
  links.forEach(l=>{const on=!r||(l.kind==='mu'?(r.M.has(l.mid)&&r.U.has(l.uid)):r.U.has(l.uid));l.target=on?(r?1.5:1):.05;});
  gItems.forEach(it=>{let on=true;if(r){if(it.kind==='project')on=r.P.has(it.id);else if(it.kind==='module')on=r.M.has(it.id);else if(it.kind==='pin')on=r.U.has(it.id)&&r.M.has(it.mid);}it.target=on?1:.14;});
  gLinks.forEach(l=>{l.target=!r?1:(r.P.has(l.a)&&r.P.has(l.b)?2.4:.12);});
  if(planet){const u=planet.mat.uniforms;const on=planet.mods.map(m=>!r||r.M.has(m.id)?1:0);while(on.length<12)on.push(0);
    u.uOn.value=on;u.uAny.value=r&&!(sel.kind==='project')?1:0;
    let si=-1;if(sel&&sel.kind==='module')si=planet.mods.findIndex(m=>m.id===sel.id);u.uSel.value=si;}
}

  if(h.kind==='user'){const u=getUser(h.id);if(!u)return'';if(h.mid){const f=findModule(h.mid);if(f)return `${u.name} · ${PERMS[permOf(f.m,u.id)].label}`;}return u.name;}return'';}
function vrPick(){camera.updateMatrixWorld(true);ray.setFromCamera(new THREE.Vector2(0,0),camera);
  const bh=ray.intersectObjects(vrBtns,false);if(bh.length)return bh[0].object.userData;return pickNdc(0,0);}
function dwellable(h){return h&&(h.kind==='vrbtn'||h.kind==='user'||(h.kind==='module'&&!h.region)||(h.kind==='project'&&view==='galaxy'&&gLevel==='universe'));}
function vrActivate(h){
  if(!h){if(vrCard||sel){select(null);hideCard();}else{const d=new THREE.Vector3();camera.getWorldDirection(d);vr.pos.addScaledVector(d,4);vrMenu.position.copy(vr.pos);}return;}
  if(h.kind==='vrbtn'){if(h.id==='exit')return exitVR();if(h.id==='back'){if(view==='galaxy'&&gLevel==='planet')exitPlanet();else{select(null);hideCard();vrPlace(true);}return;}setView(h.id);return;}
  if(h.kind==='core'){showCard(true);return;}
  select({kind:h.kind,id:h.id},false,h.mid);vrPlace(false);showCard(false);
}
const qS=new THREE.Quaternion(),qY=new THREE.Quaternion(),q0=new THREE.Quaternion(),qX=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),eul=new THREE.Euler(),ZEE=new THREE.Vector3(0,0,1),YAX=new THREE.Vector3(0,1,0);
function onOri(e){if(e.alpha==null&&e.beta==null&&e.gamma==null)return;vr.evt={a:e.alpha||0,b:e.beta||0,g:e.gamma||0};if(!vr.sensor){vr.sensor=true;vr.recenter=true;vrNote('');}}
function vrNote(msg){const n=$('#vr-note');n.textContent=msg;n.hidden=!msg;if(msg)setTimeout(()=>{if(n.textContent===msg)n.hidden=true;},5000);}
function enterVR(split){
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().catch(()=>{});}catch(e){}
  addEventListener('deviceorientation',onOri);
  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}
  vr.on=true;vr.split=split;vr.sensor=false;vr.evt=null;vr.gazeKey='';vr.fired=false;
  document.body.classList.add('vr');vrUi.hidden=false;vrUi.classList.toggle('split',split);
  closeCmd();tip.hidden=true;reticle.visible=true;vrMenu.visible=true;hover=null;
  vrPlace(true);if(sel)showCard(false);
  vrNote(split?'Turn your phone sideways and place it in your viewer':'Move your phone to look around');
  setTimeout(()=>{if(vr.on&&!vr.sensor)vrNote('Motion sensors are blocked here. Drag to look around.');},2200);
}
function exitVR(){
  vr.on=false;removeEventListener('deviceorientation',onOri);
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}catch(e){}
  document.body.classList.remove('vr');vrUi.hidden=true;reticle.visible=false;vrMenu.visible=false;hideCard();setProg(0);
  camera.fov=42;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setViewport(0,0,innerWidth,innerHeight);
  hover=null;renderInspector();
}
function vrUpdate(dt){
  vrPlace(false);
  camera.position.copy(vr.pos);
  if(vr.sensor&&vr.evt){const d=Math.PI/180;const so=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*d;
    eul.set(vr.evt.b*d,vr.evt.a*d,-vr.evt.g*d,'YXZ');qS.setFromEuler(eul);qS.multiply(qX);qS.multiply(q0.setFromAxisAngle(ZEE,-so));
    if(vr.recenter){eul.setFromQuaternion(qS,'YXZ');vr.yawOff=-eul.y;vr.recenter=false;}
    qY.setFromAxisAngle(YAX,vr.yawOff+vr.yaw);camera.quaternion.copy(qY).multiply(qS);}
  else camera.quaternion.setFromEuler(eul.set(vr.pitch,vr.yaw,0,'YXZ'));
  const h=vrPick();hover=h&&h.kind!=='vrbtn'?h:null;
  const key=h?`${h.kind}:${h.id}:${h.mid||''}`:'';
  if(key!==vr.gazeKey){vr.gazeKey=key;vr.gazeT=0;vr.fired=false;const n=gazeName(h);$('#vr-g1').textContent=n;$('#vr-g2').textContent=n;}
  if(dwellable(h)&&!vr.fired){vr.gazeT+=dt;if(vr.gazeT>1.6){vr.fired=true;vrActivate(h);}}
  setProg(dwellable(h)&&!vr.fired?Math.min(1,vr.gazeT/1.6):0);

}
function vrRender(){
  const W=innerWidth,H=innerHeight;
  if(vr.split){const sep=.1;eyeL.position.set(-sep/2,0,0);eyeR.position.set(sep/2,0,0);
    [eyeL,eyeR].forEach(e=>{e.aspect=(W/2)/H;e.fov=80;e.updateProjectionMatrix();});camera.updateMatrixWorld(true);
    renderer.setScissorTest(true);
    renderer.setViewport(0,0,W/2,H);renderer.setScissor(0,0,W/2,H);renderer.render(scene,eyeL);
    renderer.setViewport(W/2,0,W/2,H);renderer.setScissor(W/2,0,W/2,H);renderer.render(scene,eyeR);
    renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);}
  else{camera.fov=72;camera.aspect=W/H;camera.updateProjectionMatrix();if(composer)composer.render();else renderer.render(scene,camera);}
}
let vd=null;
vrUi.addEventListener('pointerdown',e=>{if(e.target.closest('#vr-exit'))return;vd={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};try{vrUi.setPointerCapture(e.pointerId);}catch(_){}});
vrUi.addEventListener('pointermove',e=>{if(!vd)return;const dx=e.clientX-vd.x,dy=e.clientY-vd.y;vd.x=e.clientX;vd.y=e.clientY;
  if(Math.hypot(e.clientX-vd.sx,e.clientY-vd.sy)>8)vd.moved=true;
  vr.yaw+=dx*.005;if(!vr.sensor)vr.pitch=clamp(vr.pitch+dy*.004,-1.45,1.45);});
vrUi.addEventListener('pointerup',e=>{if(vd&&!vd.moved){const h=vrPick();vr.fired=true;vrActivate(h);}vd=null;});
vrUi.addEventListener('pointercancel',()=>{vd=null;});
$('#vr-exit').addEventListener('click',exitVR);
$('#vr-open').addEventListener('click',()=>{
  formKind='vr';form.innerHTML=`<h2>Enter VR</h2>
  <p class="muted" style="margin:0;line-height:1.65">Aim the ring in the middle of your view at a panel, galaxy, region or person. Hold it there to select, or tap the screen. Tap empty space to fly forward. Look down for the menu.</p>
  <div class="vr-choices"><button class="btn primary" type="button" data-vrmode="split">Headset · split view</button><button class="btn" type="button" data-vrmode="mono">Handheld · single view</button></div>
  <div class="actions"><button class="btn ghost" type="button" data-close>Cancel</button></div>`;modal.hidden=false;});
form.addEventListener('click',e=>{const b=e.target.closest('[data-vrmode]');if(!b)return;const split=b.dataset.vrmode==='split';closeForm();enterVR(split);});

/* ---------- Loop ---------- */
const clock=new THREE.Clock();const tmp=new THREE.Vector3();
function runPulses(pts,list,t,motion){if(!pts)return;const pa=pts.geometry.attributes.position,ca=pts.geometry.attributes.color;
  list.forEach((p,i)=>{const u=(p.off+t*p.speed*motion)%1;p.curve.getPointAt(u,tmp);pa.setXYZ(i,tmp.x,tmp.y,tmp.z);const k=Math.min(1.4,p.link.cur)*Math.sin(u*Math.PI);ca.setXYZ(i,p.color.r*k,p.color.g*k,p.color.b*k);});
  pa.needsUpdate=true;ca.needsUpdate=true;}
function fade(list,rate){list.forEach(l=>{l.cur+=(l.target-l.cur)*rate;l.mats.forEach(([m,b])=>{m.opacity=Math.min(1,b*l.cur);});});}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const motion=reduceMotion?.25:1;
  const onPlanet=view==='galaxy'&&gLevel==='planet';
  if(!reduceMotion&&!sel&&!drag&&!onPlanet&&cmdEl.hidden&&modal.hidden&&performance.now()-lastInteract>3500)cam.tTheta+=dt*(view==='galaxy'?.03:.045);
  cam.theta+=(cam.tTheta-cam.theta)*.08;cam.phi+=(cam.tPhi-cam.phi)*.08;cam.r+=(cam.tR-cam.r)*.07;cam.target.lerp(cam.tTarget,.07);
  if(vr.on)vrUpdate(dt);else{
  camera.position.set(cam.target.x+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta),cam.target.y+cam.r*Math.cos(cam.phi),cam.target.z+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta));
  camera.lookAt(cam.target);}
  coreTime.value=t*motion;
  if(view==='chamber'){
    const coreHot=(hover&&hover.kind==='core')||!cmdEl.hidden;
    const boost=coreMat.uniforms.uBoost;boost.value+=((coreHot?1.7:1)+Math.sin(t*2)*.08-boost.value)*.1;
    baseFlare.material.opacity=.8+Math.sin(t*1.7)*.15;midFlare.scale.setScalar(5+Math.sin(t*1.3)*.6);
    coreInner.material.opacity=.5+Math.sin(t*3.1)*.12;
    items.forEach(it=>{
      if(it.kind==='module'&&it.node){it.node.rotation.y=t*1.2*motion+it.spin;const hv=hover&&hover.kind==='module'&&hover.id===it.id,sl=sel&&sel.kind==='module'&&sel.id===it.id;it.node.scale.setScalar(hv||sl?1.7:1);}
      if(it.kind==='user'&&it.node){const hv=hover&&hover.kind==='user'&&hover.id===it.id,sl=sel&&sel.kind==='user'&&sel.id===it.id;it.node.scale.setScalar(hv||sl?1.35:1);it.ring.material.rotation=t*.6*motion;}
    });
    fade(items,.12);fade(links,.12);runPulses(pulsePoints,pulseList,t,motion);
  }else{
    gItems.forEach(it=>{
      const host=(onPlanet&&it.kind==='project'&&it.id===planetProject)?.2:1;
      it.cur+=(it.target*host-it.cur)*.1;it.mats.forEach(([m,b])=>{m.opacity=Math.min(1,b*it.cur);});
      if(it.spin)it.spin.rotation.y+=dt*it.speed*motion;
      if(it.kind==='project'&&it.label)it.label.visible=!onPlanet||it.id!==planetProject;
      if(it.kind==='pin'){const hv=hover&&hover.kind==='user'&&hover.id===it.id&&hover.mid===it.mid;
        it.node.scale.setScalar(hv?1.7:1);it.ring.material.rotation=t*.8*motion;
        it.label.visible=hv||!!(sel&&(sel.kind==='module'||sel.kind==='user')&&it.target===1);}
    });
    gLinks.forEach(l=>{const tg=onPlanet?l.target*.35:l.target;l.cur+=(tg-l.cur)*.1;l.mats.forEach(([m,b])=>{m.opacity=Math.min(1,b*l.cur);});});
    runPulses(gPulsePoints,gPulseList,t,motion);
    if(planet&&!(sel&&(sel.kind==='module'||sel.kind==='user')))planet.body.rotation.y+=dt*.05*motion;
  }
  if(bloom){const gs=onPlanet?.5:.95,gt=onPlanet?.42:.2;bloom.strength+=(gs-bloom.strength)*.08;bloom.threshold+=(gt-bloom.threshold)*.08;}
  if(vr.on){vrRender();return;}
  updateHover();
  if(composer)composer.render();else renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer)composer.setSize(innerWidth,innerHeight);if(bloom)bloom.setSize(innerWidth,innerHeight);});

const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('700 40px "Chakra Petch"'),document.fonts.load('600 40px "Chakra Petch"'),document.fonts.load('500 16px "JetBrains Mono"'),document.fonts.load('700 16px "JetBrains Mono"')]).catch(()=>{}):Promise.resolve();
rebuild();frame();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(()=>rebuild());
})();
</script>
